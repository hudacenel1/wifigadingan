<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidio Pro Clone - Full Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --vidio-red: #ff1e1e;
            --sidebar-width: 240px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 0 25px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--vidio-red);
            text-decoration: none;
        }

        .menu-item {
            padding: 12px 25px;
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .menu-item:focus, .menu-item:hover, .menu-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(255,30,30,0.1) 0%, transparent 100%);
            border-left-color: var(--vidio-red);
            outline: none;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Hero Banner Slider */
        .hero-slider {
            width: 100%;
            height: 350px;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .carousel-item {
            height: 350px;
            background-size: cover;
            background-position: center;
        }

        .carousel-caption-custom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 40px 30px;
            background: linear-gradient(to top, var(--bg-dark), transparent);
        }

        /* Player Section */
        .player-wrapper {
            padding: 0 30px;
            margin-bottom: 40px;
        }

        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Grid Channel */
        .content-section { padding: 0 30px 50px; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Channel Card */
        .chan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
        }

        .chan-card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .chan-card:focus, .chan-card:hover {
            transform: scale(1.08);
            background: #2a2a2a;
            border-color: var(--vidio-red);
            outline: none;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="#" class="sidebar-brand">VIDIO<span style="color:white">PRO</span></a>
        <a href="#" class="menu-item active" tabindex="1"><i class="bi bi-house-door"></i> Home</a>
        <a href="#" class="menu-item" tabindex="1"><i class="bi bi-tv"></i> Live TV</a>
        <a href="#" class="menu-item" tabindex="1"><i class="bi bi-trophy"></i> Sports</a>
        <a href="#" class="menu-item" tabindex="1"><i class="bi bi-film"></i> Movies</a>
    </div>

    <div class="main-content">
        
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" style="background-image: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=1200')">
                    <div class="carousel-caption-custom">
                        <h2 class="fw-bold">Premier League</h2>
                        <p>Saksikan pertandingan seru malam ini secara Live!</p>
                        <button class="btn btn-danger px-4 fw-bold">NONTON SEKARANG</button>
                    </div>
                </div>
                <div class="carousel-item" style="background-image: url('https://images.unsplash.com/photo-1624555130581-1d9cca783bc0?auto=format&fit=crop&q=80&w=1200')">
                    <div class="carousel-caption-custom">
                        <h2 class="fw-bold">Original Series</h2>
                        <p>Koleksi film eksklusif hanya untuk Anda.</p>
                        <button class="btn btn-danger px-4 fw-bold">LIHAT DETAIL</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="player-wrapper">
            <div class="player-container" id="video-section">
                <iframe id="main-player" src="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==" allowfullscreen></iframe>
            </div>
        </div>

        <div class="content-section">
            <div class="section-header">
                <h4>Channel TV Nasional</h4>
                <button class="btn btn-sm btn-outline-light" onclick="toggleFullscreen()">Layar Penuh</button>
            </div>

            <div class="grid-channels">
                <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/GTV_Logo_2022.svg/1200px-GTV_Logo_2022.svg.png">
                    <div class="chan-name">GTV</div>
                </a>
                
                <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/MNCTV_logo_2015.svg/1200px-MNCTV_logo_2015.svg.png">
                    <div class="chan-name">MNCTV</div>
                </a>

                <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/INews_2023.svg/1200px-INews_2023.svg.png">
                    <div class="chan-name">iNews</div>
                </a>

                <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://20.detik.com/watch/livestreaming-trans7')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Trans7_2013.svg/1200px-Trans7_2013.svg.png">
                    <div class="chan-name">Trans7</div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function playChan(url) {
            document.getElementById('main-player').src = url;
            // Scroll ke posisi player agar nyaman dilihat
            document.querySelector('.player-wrapper').scrollIntoView({ behavior: 'smooth' });
        }

        function toggleFullscreen() {
            const ps = document.getElementById('video-section');
            if (ps.requestFullscreen) ps.requestFullscreen();
            else if (ps.webkitRequestFullscreen) ps.webkitRequestFullscreen();
        }

        // Auto-focus awal
        window.onload = () => document.querySelector('.menu-item.active').focus();
    </script>
</body>
</html>
