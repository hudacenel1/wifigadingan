<script>
    function changeChannel(name, url) {
        // Ganti URL Iframe
        document.getElementById('mainPlayer').src = url;
        // Ganti Judul
        document.getElementById('channelTitle').innerText = 'Sedang Menonton: ' + name;
        
        // Update styling list
        let items = document.querySelectorAll('.channel-item');
        items.forEach(item => {
            item.classList.remove('active');
            if(item.innerText === name) {
                item.classList.add('active');
            }
        });
    }
</script>
