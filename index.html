<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - TV Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-color: #ffcc00; /* Kuning Gading */
            --sidebar-width: 260px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .brand-container {
            padding: 10px 20px 25px;
            text-align: center;
        }

        .brand-logo {
            width: 100px; /* Ukuran logo gajah */
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            padding: 5px;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-color);
            display: block;
            letter-spacing: 1px;
        }

        .menu-item {
            padding: 12px 25px;
            color: #bbb;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }

        .menu-item i { font-size: 1.2rem; }

        .menu-item:hover, .menu-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(255,204,0,0.1) 0%, transparent 100%);
            border-left-color: var(--accent-color);
        }

        /* WhatsApp Section */
        .wa-section {
            margin: 15px 25px;
            padding-top: 15px;
            border-top: 1px solid #222;
        }

        .wa-link {
            color: #25d366;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .player-box {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
        }

        .chan-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            background: #252525;
        }

        .chan-card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        /* Custom Scrollbar */
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-container">
            <img src="https://via.placeholder.com/100/ffcc00/000000?text=GAJAH" alt="WIFI GADINGAN" class="brand-logo">
            <span class="brand-name">WIFI GADINGAN</span>
        </div>
        
        <nav>
            <a href="#" class="menu-item active"><i class="bi bi-house"></i> Home</a>
            <a href="#" class="menu-item"><i class="bi bi-tv"></i> Live TV</a>
            <a href="#" class="menu-item"><i class="bi bi-trophy"></i> Sports</a>
            <a href="#" class="menu-item"><i class="bi bi-film"></i> Movies</a>
        </nav>

        <div class="wa-section">
            <a href="https://wa.me/6289632950308" target="_blank" class="wa-link">
                <i class="bi bi-whatsapp" style="font-size: 1.3rem;"></i>
                089632950308
            </a>
        </div>

        <div style="margin-top: auto; padding: 20px;">
            <button class="btn btn-sm btn-outline-warning w-100" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> Refresh App
            </button>
        </div>
    </div>

    <div class="main-content">
        
        <div class="player-box" id="video-section">
            <iframe id="main-player" 
                src="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==" 
                allow="autoplay; fullscreen">
            </iframe>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Saluran TV Pilihan</h4>
            <button class="btn btn-sm btn-light" onclick="toggleFullscreen()">
                <i class="bi bi-fullscreen"></i> Mode Fullscreen
            </button>
        </div>

        <div class="grid-channels">
            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/GTV_Logo_2022.svg/1200px-GTV_Logo_2022.svg.png">
                <div class="fw-bold">GTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/MNCTV_logo_2015.svg/1200px-MNCTV_logo_2015.svg.png">
                <div class="fw-bold">MNCTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/INews_2023.svg/1200px-INews_2023.svg.png">
                <div class="fw-bold">iNews</div>
            </a>
        </div>
    </div>

    <script>
        function playChan(url) {
            document.getElementById('main-player').src = url;
            document.querySelector('.main-content').scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleFullscreen() {
            const el = document.getElementById('video-section');
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
