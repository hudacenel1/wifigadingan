<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TV Online Pro - Remote Mode</title>
    <style>
        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; --active: #333; --focus: #444; --promo-bg: #ffd700; --download: #007bff; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); position: sticky; top: 0; background: var(--sidebar); z-index: 10; }
        
        .download-btn {
            display: flex; align-items: center; justify-content: center; background: var(--download);
            color: white; padding: 15px; margin: 10px; border-radius: 8px; text-decoration: none;
            font-weight: bold; font-size: 14px; transition: 0.3s;
        }

        .channel { 
            display: flex; align-items: center; padding: 15px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222; outline: none;
        }
        .channel:hover, .channel.focused { background: var(--focus); border-left: 4px solid var(--primary); }
        .channel.active { background: var(--active); border-left: 4px solid var(--primary); }
        
        .channel img { width: 60px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #fff; }
        .channel h4 { margin: 0; font-size: 14px; }

        /* MAIN PLAYER */
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info-bar { padding: 10px 20px; background: #111; border-bottom: 1px solid #333; }
        #titleStatus { margin: 0; font-size: 16px; color: #ccc; }

        /* OVERLAY FULL TV INDONESIA */
        #fullOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }
        #fullOverlay iframe { width: 100%; height: 100%; border: none; }
        
        /* Tombol Kembali Melayang */
        .btn-close-overlay {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 0, 0, 0.6); 
            color: white; padding: 8px 15px; border: none; border-radius: 20px; 
            cursor: pointer; font-size: 12px; z-index: 10000; backdrop-filter: blur(5px);
        }
        .btn-close-overlay:hover { background: red; }

        .promo-marquee { background: var(--promo-bg); color: #000; padding: 8px 0; font-weight: bold; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>
<body>

    <div id="fullOverlay">
        <button class="btn-close-overlay" onclick="closeFull()">← KEMBALI</button>
        <iframe id="fullFrame" src=""></iframe>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="header">GADINGAN TV</div>
        
        <a href="gadingantv.apk" class="download-btn" download="GadinganTV.apk">
            <span>DOWNLOAD APK TV GADINGAN</span>
        </a>

        <div class="channel active" tabindex="0" onclick="changeChan('yNKvkPJl-tg', 'TV One Live', true, this)">
            <img src="https://img.youtube.com/vi/yNKvkPJl-tg/mqdefault.jpg">
            <h4>TV One</h4>
        </div>

        <div class="channel" tabindex="0" onclick="changeChan('https://www.cnnindonesia.com/tv/embed?ref=transmedia', 'CNN Indonesia', false, this)">
            <img src="cnn.png">
            <h4>CNN Indonesia</h4>
        </div>

        <div class="channel" tabindex="0" onclick="changeChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1', 'iNews', false, this)">
            <img src="inews.jpg">
            <h4>iNews</h4>
        </div>

        <div class="channel" tabindex="0" onclick="openFull('tvindonesia.html')">
            <img src="tvindonesia.jpg">
            <h4>TV INDONESIA</h4>
        </div>
    </div>

    <div class="main">
        <div class="info-bar">
            <div id="titleStatus">Sedang Menonton: TV One</div>
        </div>
        <div class="player-wrapper">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/yNKvkPJl-tg?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="promo-marquee">
            <marquee scrollamount="7">
                Promo Spesial! Pasang Wifi Gadingan Hanya Rp 60.000/Bulan &nbsp;&nbsp; | &nbsp;&nbsp; WA: 0896-3295-0308 &nbsp;&nbsp; | &nbsp;&nbsp; Internet Cepat, Harga Sahabat!
            </marquee>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const channels = document.querySelectorAll('.channel');

        function changeChan(source, name, isYouTube, element) {
            const player = document.getElementById('videoPlayer');
            const titleDisplay = document.getElementById('titleStatus');
            channels.forEach(c => c.classList.remove('active'));
            if (isYouTube) {
                player.src = "https://www.youtube.com/embed/" + source + "?autoplay=1&rel=0";
            } else {
                player.src = source;
            }
            titleDisplay.innerText = "Sedang Menonton: " + name;
            if(element) element.classList.add('active');
        }

        // FUNGSI OVERLAY (Biar tetap di dalam APK)
        function openFull(url) {
            const overlay = document.getElementById('fullOverlay');
            const frame = document.getElementById('fullFrame');
            frame.src = url;
            overlay.style.display = 'block';
            // Fokuskan ke overlay agar tombol back berfungsi
            overlay.focus();
        }

        function closeFull() {
            const overlay = document.getElementById('fullOverlay');
            const frame = document.getElementById('fullFrame');
            frame.src = ""; // Matikan suara saat keluar
            overlay.style.display = 'none';
        }

        // Navigasi Remote & Tombol Back Android
        document.addEventListener('keydown', function(e) {
            const isOverlayOpen = document.getElementById('fullOverlay').style.display === 'block';

            if (isOverlayOpen) {
                // Jika sedang di TV Indonesia, Back atau Escape akan kembali ke portal
                if (e.key === "Escape" || e.key === "Backspace") {
                    closeFull();
                    e.preventDefault();
                }
                return; 
            }

            if (e.key === "ArrowDown") {
                currentIndex = (currentIndex + 1) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (currentIndex !== -1) {
                    channels[currentIndex].click();
                }
            }
        });

        function updateFocus() {
            channels.forEach((c, index) => {
                if (index === currentIndex) {
                    c.classList.add('focused');
                    c.focus(); 
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    c.classList.remove('focused');
                }
            });
        }
    </script>
</body>
</html>
