        .player-box { position: sticky; top: 0; z-index: 1000; background: #000; width: 100%; }

        .main-content { flex: 1; overflow-y: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

        .card { 
            background: var(--card); border-radius: 8px; padding: 15px 5px; text-align: center; 
            cursor: pointer; transition: 0.2s; border: 2px solid transparent; 
            font-size: 12px; display: flex; align-items: center; justify-content: center; min-height: 50px;
        }
        .card:hover { background: #333; }
        .card.active { border-color: var(--primary); background: #333; color: var(--primary); font-weight: bold; }

        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
    </style>

    // Inisialisasi Video.js dengan optimasi Buffer
    const player = videojs('tv-player', {
        autoplay: true,
        html5: {
            vhs: {
                overrideNative: true,
                maxBufferLength: 60, // Buffer 1 menit ke depan
                initialBufferedSeconds: 8,
                enableLowInitialPlaylist: true
            }
        }
    });

    const container = document.getElementById('container');
    const search = document.getElementById('searchBox');
    const info = document.getElementById('info');

    function play(url, name, element) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play().catch(e => console.log("User interaction required"));
        info.innerText = "Memutar: " + name;

        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        if(element) element.classList.add('active');
        
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Auto-retry jika gagal muat segmen
    player.on('error', function() {
        const currentSrc = player.src();
        if(currentSrc) {
            console.log("Retrying stream...");
            setTimeout(() => {
                player.src(currentSrc);
                player.load();
                player.play();
            }, 3000);
        }
    });

    function render(filter = "") {
        container.innerHTML = "";
        const list = channels.filter(c => c.n.toLowerCase().includes(filter.toLowerCase()));
        list.forEach(ch => {
            const div = document.createElement('div');
            div.className = "card";
            div.innerText = ch.n;
            div.onclick = () => play(ch.u, ch.n, div);
            container.appendChild(div);
        });
    }

    search.addEventListener('input', (e) => render(e.target.value));
    
    // Inisialisasi awal
    render();
    if(channels.length > 0) play(channels[0].u, channels[0].n, document.querySelector('.card'));
