<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidio Pro Clone - Sidebar Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --vidio-red: #ff1e1e;
            --sidebar-width: 240px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .sidebar-brand {
            padding: 0 25px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--vidio-red);
            text-decoration: none;
        }

        .menu-item {
            padding: 12px 25px;
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .menu-item i { font-size: 1.2rem; }

        .menu-item:focus, .menu-item:hover, .menu-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(255,30,30,0.1) 0%, transparent 100%);
            border-left-color: var(--vidio-red);
            outline: none;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        /* Player Section */
        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Grid Channel */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Channel Card */
        .chan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
        }

        .chan-card img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: grayscale(0.2);
            transition: 0.3s;
        }

        .chan-card:focus, .chan-card:hover {
            transform: scale(1.05);
            background: #2a2a2a;
            border-color: var(--vidio-red);
            outline: none;
        }

        .chan-card:focus img, .chan-card:hover img {
            filter: grayscale(0);
        }

        .chan-name { font-size: 0.9rem; font-weight: 600; }

        /* Custom Scrollbar */
        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

        <a href="#" class="menu-item" tabindex="1"><i class="bi bi-trophy"></i> Sports</a>
        <a href="#" class="menu-item" tabindex="1"><i class="bi bi-film"></i> Movies</a>
        
        <div style="margin-top: auto; padding: 20px;">
            <button class="btn btn-outline-danger btn-sm w-100" onclick="location.reload()">Refresh App</button>

    <div class="main-content">

    </div>

    <script>
        const player = document.getElementById('main-player');
        const playerSection = document.getElementById('video-section');

        function playChan(url) {
            player.src = url;
            document.querySelector('.main-content').scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleFullscreen() {
            if (playerSection.requestFullscreen) playerSection.requestFullscreen();
            else if (playerSection.webkitRequestFullscreen) playerSection.webkitRequestFullscreen();
        }

        // Focus management untuk remote
        window.onload = () => {
            document.querySelector('.menu-item.active').focus();
        };

        // Event listener navigasi panah
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;

            }
        });
    </script>
</body>
</html>
