<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --brand-color: #ffc107; /* Warna Kuning seperti Logo */
            --sidebar-width: 260px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .brand-section {
            padding: 10px 20px 30px;
            text-align: center;
        }

        .brand-logo {
            width: 120px; /* Ukuran Logo Gajah */
            height: auto;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--brand-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }

        .menu-item {
            padding: 12px 25px;
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .menu-item i { font-size: 1.2rem; }

        .menu-item:hover, .menu-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(255,193,7,0.1) 0%, transparent 100%);
            border-left-color: var(--brand-color);
            outline: none;
        }

        /* WhatsApp Section */
        .wa-info {
            margin-top: 15px;
            padding: 15px 25px;
            border-top: 1px solid #222;
            color: #25d366; /* Warna WhatsApp */
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
        }

        .chan-card img {
            width: 100%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .chan-card:hover {
            transform: scale(1.05);
            background: #2a2a2a;
            border-color: var(--brand-color);
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-section">
            <img src="https://i.ibb.co/p6pM6mH/elephant-logo.png" alt="Logo" class="brand-logo">
            <span class="brand-name">WIFI GADINGAN</span>
        </div>
        
        <a href="#" class="menu-item active"><i class="bi bi-house-door"></i> Home</a>
        <a href="#" class="menu-item"><i class="bi bi-tv"></i> Live TV</a>
        <a href="#" class="menu-item"><i class="bi bi-trophy"></i> Sports</a>
        <a href="#" class="menu-item"><i class="bi bi-film"></i> Movies</a>
        
        <div class="wa-info">
            <i class="bi bi-whatsapp"></i>
            <span>089632950308</span>
        </div>

        <div style="margin-top: auto; padding: 20px;">
            <button class="btn btn-outline-warning btn-sm w-100" onclick="location.reload()">Refresh App</button>
        </div>
    </div>

    <div class="main-content">
        <div class="player-container" id="video-section">
            <iframe id="main-player" 
                src="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==" 
                allow="autoplay; fullscreen">
            </iframe>
        </div>

        <div class="d-flex justify-content-between align-items:center; margin-bottom: 20px;">
            <h4>TV Nasional Terpopuler</h4>
            <button class="btn btn-sm btn-outline-light" onclick="toggleFullscreen()">Layar Penuh <i class="bi bi-fullscreen"></i></button>
        </div>

        <div class="grid-channels">
            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/GTV_Logo_2022.svg/1200px-GTV_Logo_2022.svg.png">
                <div class="chan-name">GTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/MNCTV_logo_2015.svg/1200px-MNCTV_logo_2015.svg.png">
                <div class="chan-name">MNCTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/INews_2023.svg/1200px-INews_2023.svg.png">
                <div class="chan-name">iNews</div>
            </a>
        </div>
    </div>

    <script>
        const player = document.getElementById('main-player');
        const playerSection = document.getElementById('video-section');

        function playChan(url) {
            player.src = url;
            document.querySelector('.main-content').scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleFullscreen() {
            if (playerSection.requestFullscreen) playerSection.requestFullscreen();
            else if (playerSection.webkitRequestFullscreen) playerSection.webkitRequestFullscreen();
        }
    </script>
</body>
</html>
