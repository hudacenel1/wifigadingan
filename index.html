<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard - WiFi Joss</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-focus: #ffffff;
            --accent-color: #00c6ff;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            overflow: hidden; /* Mencegah scroll mouse */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .time { font-size: 1.5rem; font-weight: bold; }

        h2 { color: #aaa; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

        /* Row Kontainer */
        .app-row {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            padding: 10px 0;
        }

        /* Item Aplikasi */
        .app-item {
            background: #1a1a1a;
            width: 200px;
            height: 120px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            border: 4px solid transparent;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Efek Fokus Remote */
        .app-item:focus {
            transform: scale(1.15);
            border-color: var(--card-focus);
            background: var(--accent-color);
            box-shadow: 0 10px 30px rgba(0, 198, 255, 0.4);
        }

        .app-item i { font-size: 2.5rem; margin-bottom: 10px; }
        .app-item span { font-weight: bold; font-size: 1rem; }

        /* Tombol Kembali */
        .back-btn {
            position: fixed;
            bottom: 40px;
            left: 40px;
            padding: 10px 20px;
            background: #333;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            outline: none;
            border: 2px solid transparent;
        }

        .back-btn:focus {
            background: #ff4444;
            border-color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>WIFI GADINGAN <span style="color: var(--accent-color);">TV</span></h1>
        <div class="time" id="clock">12:00</div>
    </div>

    <h2>Aplikasi Hiburan</h2>
    <div class="app-row">
        <a href="https://www.youtube.com" class="app-item" tabindex="1">
            <span>YOUTUBE</span>
        </a>
        <a href="tv.html" class="app-item" tabindex="2">
            <span>TV LUAR</span>
        </a>
        <a href="https://www.vidio.com" class="app-item" tabindex="3">
            <span>VIDIO</span>
        </a>
        <a href="https://tvindonesia.html" class="app-item" tabindex="4">
            <span>TV INDONESIA</span>
        </a>
    </div>

    <h2>Alat & Sistem</h2>
    <div class="app-row">
        <a href="https://fast.com" class="app-item" tabindex="5">
            <span>CEK SPEED</span>
        </a>
        <a href="https://google.com" class="app-item" tabindex="6">
            <span>BROWSER</span>
        </a>
        <a href="index.html" class="app-item" style="background: #333;" tabindex="7">
            <span>PROMO WIFI</span>
        </a>
    </div>

    <a href="index.html" class="back-btn" tabindex="8">← Kembali ke Utama</a>

    <script>
        // Fungsi Jam Real-time
        function updateClock() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fokus otomatis ke aplikasi pertama saat buka
        window.onload = () => {
            document.querySelector('.app-item').focus();
        };
    </script>
</body>
</html>
