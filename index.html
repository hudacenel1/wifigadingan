<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TV Online Pro - Remote Mode</title>
    <style>
        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; --active: #333; --focus: #444; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); position: sticky; top: 0; background: var(--sidebar); z-index: 10; }
        
        .channel { 
            display: flex; align-items: center; padding: 15px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222; outline: none;
        }
        .channel:hover, .channel.focused { background: var(--focus); border-left: 4px solid var(--primary); }
        .channel.active { background: var(--active); }
        
        .channel img { width: 60px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #000; }
        .channel h4 { margin: 0; font-size: 14px; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info { padding: 20px; background: #111; border-top: 1px solid #333; }
        .instruction { font-size: 12px; color: #888; margin-top: 5px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="header">DAFTAR SALURAN</div>
        
        <div class="channel" tabindex="0" onclick="changeChan('yNKvkPJl-tg', 'TV One Live', true)">
            <img src="https://img.youtube.com/vi/yNKvkPJl-tg/mqdefault.jpg">
            <h4>TV One</h4>
        </div>

        

        <div class="channel" tabindex="0" onclick="changeChan('https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8', 'TVRI Nasional', true)">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/TVRI_Nasional_Logo.svg/1200px-TVRI_Nasional_Logo.svg.png" alt="TVRI Nasional Logo" style="width:100px;">
    <h4>TVRI Nasional</h4>
</div>

       

        
        <div class="channel" tabindex="0" onclick="changeChan('https://20.detik.com/watch/livestreaming-transtv', 'Transtv', false)">
    <img src="transtv.jpg" alt="Logo Transtv" style="background: white; width: 50px; height: auto;">
    <h4>Trantv</h4>
</div>
        
        <div class="channel" tabindex="0" onclick="changeChan('https://20.detik.com/watch/livestreaming-trans7', 'Trans 7', false)">
    <img src="trans7.jpg" alt="Logo Trans 7" style="background: white; width: 50px; height: auto;">
    <h4>Trans 7</h4>
</div>
        <div class="channel-list">
    <div class="channel" tabindex="0" onclick="changeChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGcmN0aSUyRmluZXdzaWQmaGVpZ2h0PTEwMCUyNSZ3aWR0aD0xMDAlMjU=', 'Trans 7', false)">
        <img src="rcti.jpg" style="background: white;">
        <h4>rcti</h4>
    </div>

    <div class="channel" tabindex="0" onclick="changeChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==', 'Trans TV', false)">
        <img src="gtv.jpg" style="background: white;">
        <h4>gtv</h4>
    </div>
</div>
    </div>

    <div class="main">
        <div class="player-wrapper">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/yNKvkPJl-tg?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="info">
            <h2 id="title">Sedang Menonton: TV One Live</h2>
            <p>Status: <span style="color: lime;">Online</span></p>
            <p class="instruction">Navigasi Remote: Gunakan <b>Panah Atas/Bawah</b> untuk memilih, <b>Enter</b> untuk memutar.</p>
        </div>
    </div>

    <script>
        let currentIndex = -1;
        const channels = document.querySelectorAll('.channel');

        function changeChan(source, name, isYouTube) {
            const player = document.getElementById('videoPlayer');
            const title = document.getElementById('title');
            
            // Hapus kelas active dari semua saluran
            channels.forEach(c => c.classList.remove('active'));
            
            if (isYouTube) {
                player.src = "https://www.youtube.com/embed/" + source + (source.includes('?') ? "&" : "?") + "autoplay=1&rel=0";
            } else {
                player.src = source;
            }
            
            title.innerText = "Sedang Menonton: " + name;
            
            // Tandai saluran yang aktif
            event?.currentTarget?.classList.add('active');
        }

        // Fitur Remote Keyboard
        document.addEventListener('keydown', function(e) {
            if (e.key === "ArrowDown") {
                currentIndex = (currentIndex + 1) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (currentIndex !== -1) {
                    channels[currentIndex].click();
                }
            }
        });

        function updateFocus() {
            channels.forEach((c, index) => {
                if (index === currentIndex) {
                    c.classList.add('focused');
                    c.focus(); // Scroll otomatis ke elemen yang dipilih
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    c.classList.remove('focused');
                }
            });
        }
    </script>
</body>
</html>
