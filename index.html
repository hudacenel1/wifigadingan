<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - TV Remote Ready</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-color: #ffcc00;
            --sidebar-width: 240px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .brand-container {
            padding: 0 20px 20px;
            text-align: center;
        }

        /* Logo/gajah*/
        .brand-logo {
            width: 140px;
            height: auto;
            object-fit: contain;
        }

        .menu-item {
            padding: 15px 25px;
            color: #bbb;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        /* Efek Fokus untuk Remote */
        .menu-item:focus, .chan-card:focus {
            outline: none;
            background: rgba(255, 204, 0, 0.2);
            border-color: var(--accent-color);
            color: #fff;
            transform: scale(1.02);
        }

        .wa-section {
            margin-top: 10px;
            padding: 15px 25px;
            border-top: 1px solid #222;
            color: #25d366;
            font-weight: bold;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .player-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            margin-bottom: 30px;
            border: 2px solid #333;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
            transition: 0.2s;
        }

        .chan-card img { width: 100%; height: 60px; object-fit: contain; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-container">
            <img src="URL_GAMBAR_GAJAH_ANDA" alt="Logo" class="brand-logo">
        </div>
        
        <nav id="nav-menu">
            <a href="#" class="menu-item active" tabindex="1"><i class="bi bi-house"></i> Home</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-tv"></i> Live TV</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-trophy"></i> Sports</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-film"></i> Movies</a>
        </nav>

        <div class="wa-section">
            <i class="bi bi-whatsapp"></i> 089632950308
        </div>
    </div>

    <div class="main-content" id="scroll-container">
        <div class="player-box">
            <iframe id="main-player" src="URL_DEFAULT_CHANNEL" allowfullscreen></iframe>
        </div>

        <div class="grid-channels">
            <a href="#" class="chan-card" tabindex="2" onclick="playChan('LINK_1')">
                <img src="LOGO_GTV"><div>GTV</div>
            </a>
            <a href="#" class="chan-card" tabindex="2" onclick="playChan('LINK_2')">
                <img src="LOGO_MNCTV"><div>MNCTV</div>
            </a>
            <a href="#" class="chan-card" tabindex="2" onclick="playChan('LINK_3')">
                <img src="LOGO_INEWS"><div>iNews</div>
            </a>
            </div>
    </div>

    <script>
        // FUNGSI NAVIGASI REMOTE TV
        document.addEventListener('keydown', function(e) {
            const active = document.activeElement;
            const container = document.getElementById('scroll-container');

            switch(e.key) {
                case "ArrowUp":
                    // Logika pindah ke atas
                    break;
                case "ArrowDown":
                    // Logika pindah ke bawah
                    break;
                case "ArrowLeft":
                    if (active.classList.contains('chan-card')) {
                        let prev = active.previousElementSibling;
                        if (prev) prev.focus();
                        else document.querySelector('.menu-item').focus();
                    }
                    break;
                case "ArrowRight":
                    if (active.classList.contains('menu-item')) {
                        document.querySelector('.chan-card').focus();
                    } else if (active.classList.contains('chan-card')) {
                        let next = active.nextElementSibling;
                        if (next) next.focus();
                    }
                    break;
                case "PageUp":
                    container.scrollBy(0, -400); // Scroll ke atas
                    break;
                case "PageDown":
                    container.scrollBy(0, 400); // Scroll ke bawah
                    break;
                case "Enter":
                    active.click(); // Pilih channel
                    break;
            }
        });

        function playChan(url) {
            document.getElementById('main-player').src = url;
            window.scrollTo(0,0);
        }

        // Auto-focus saat pertama buka
        window.onload = () => document.querySelector('.menu-item.active').focus();
    </script>
</body>
</html>
