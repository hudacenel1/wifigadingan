<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-color: #ffcc00; /* Warna kuning emas */
            --sidebar-width: 240px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .brand-container {
            padding: 0 20px 30px;
            text-align: center;
        }

        /* Logo Gajah */
        .brand-logo {
            width: 140px;
            height: auto;
            object-fit: contain;
        }

        .menu-item {
            padding: 15px 25px;
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        /* State Fokus untuk Remote TV */
        .menu-item:focus, .chan-card:focus {
            outline: none;
            background: linear-gradient(90deg, rgba(255,204,0,0.2) 0%, transparent 100%);
            border-left-color: var(--accent-color);
            color: #fff;
        }

        .menu-item.active {
            color: var(--accent-color);
        }

        /* WhatsApp Section */
        .wa-section {
            margin-top: 10px;
            padding: 20px 25px;
            border-top: 1px solid #222;
            color: #25d366;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            margin-bottom: 35px;
            border: 1px solid #333;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 3px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
        }

        .chan-card:focus {
            transform: scale(1.05);
            border-color: var(--accent-color);
            background: #2a2a2a;
        }

        .chan-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .chan-name { font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-container">
            <img src="gajah.png" alt="Logo" class="brand-logo">
        </div>
        
        <nav id="sidebar-nav">
            <a href="#" class="menu-item active" tabindex="1"><i class="bi bi-house-door"></i> Home</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-tv"></i> Live TV</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-trophy"></i> Sports</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-film"></i> Movies</a>
        </nav>

        <div class="wa-section">
            <i class="bi bi-whatsapp"></i>
            <span>089632950308</span>
        </div>

        <div style="margin-top: auto; padding: 20px;">
            <button class="btn btn-outline-warning btn-sm w-100" onclick="location.reload()">Refresh App</button>
        </div>
    </div>

    <div class="main-content" id="main-scroll">
        
        <div class="player-container" id="video-box">
            <iframe id="main-player" 
                src="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==" 
                allow="autoplay; fullscreen">
            </iframe>
        </div>

        <h4 class="mb-4">Saluran TV Nasional</h4>

        <div class="grid-channels" id="channel-grid">
            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/GTV_Logo_2022.svg/1200px-GTV_Logo_2022.svg.png">
                <div class="chan-name">GTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/MNCTV_logo_2015.svg/1200px-MNCTV_logo_2015.svg.png">
                <div class="chan-name">MNCTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/INews_2023.svg/1200px-INews_2023.svg.png">
                <div class="chan-name">iNews</div>
            </a>
        </div>
    </div>

    <script>
        const player = document.getElementById('main-player');
        const scrollArea = document.getElementById('main-scroll');

        function playChan(url) {
            player.src = url;
            scrollArea.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- SISTEM NAVIGASI REMOTE TV ---
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;

            switch(e.key) {
                case "ArrowRight":
                    if (active.classList.contains('menu-item')) {
                        document.querySelector('.chan-card').focus();
                    }
                    break;
                case "ArrowLeft":
                    if (active.classList.contains('chan-card')) {
                        document.querySelector('.menu-item.active').focus();
                    }
                    break;
                case "PageDown":
                    scrollArea.scrollBy(0, 500);
                    break;
                case "PageUp":
                    scrollArea.scrollBy(0, -500);
                    break;
                case "Enter":
                    // Biarkan fungsi klik default bekerja
                    break;
            }
        });

        // Focus otomatis ke menu saat aplikasi dibuka
        window.onload = () => {
            document.querySelector('.menu-item.active').focus();
        };
    </script>
</body>
</html>
