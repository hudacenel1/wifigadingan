<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoStream Premium</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --accent: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* Video Player Section */
        .player-container {
            width: 100%;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .video-js { width: 100%; aspect-ratio: 16/9; }

        /* Header & Search */
        .header {
            padding: 15px;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg));
        }
        .search-wrapper {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }
        #searchBar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--accent);
            background: #222;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        #searchBar:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,0,0,0.3); }

        /* Grid View */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
        }

        /* Card Style */
        .channel-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid transparent;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .channel-card:hover, .channel-card:focus {
            transform: translateY(-5px);
            background: #252525;
            border-color: var(--primary);
            outline: none;
        }

        /* Logo Styling */
        .logo-box {
            width: 70px;
            height: 70px;
            background: #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #aaa;
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
        }
        .logo-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Info Now Playing */
        .now-playing-bar {
            padding: 5px 20px;
            font-size: 0.9rem;
            color: #ccc;
            background: var(--bg);
            text-align: center;
        }
        .now-playing-bar span { color: var(--primary); font-weight: bold; }

        @media (min-width: 1024px) {
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .logo-box { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="tv-player" class="video-js vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="now-playing-bar" id="infoBar">Memilih Channel...</div>

<div class="header">
    <div class="search-wrapper">
        <input type="text" id="searchBar" placeholder="Cari Channel TV...">
    </div>
</div>

<div class="content-area">
    <div class="channel-grid" id="mainGrid"></div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
    // Database Channel (Hanya URL Dasar, Sisanya Autogenerate)
    const channels = [
        {n: "Trans7", u: "https://video.detik.com/trans7/smil:trans7.smil/index.m3u8"},
        {n: "Trans TV", u: "https://video.detik.com/transtv/smil:transtv.smil/index.m3u8"},
        {n: "RCTI", u: "https://allcutv.rctiplus.id/rcti2023.m3u8"},
        {n: "MNCTV", u: "https://allcutv.rctiplus.id/mnctv2023.m3u8"},
        {n: "GTV", u: "http://203.77.246.58:4500/udp/239.1.3.68:5000"},
        {n: "iNews", u: "https://allcutv.rctiplus.id/inews2023.m3u8"},
        {n: "SCTV", u: "http://203.77.246.58:4500/udp/239.1.1.108:5000"},
        {n: "Indosiar", u: "http://203.77.246.58:4500/udp/239.1.1.110:5000"},
        {n: "CNBC Indonesia", u: "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/master.m3u8"},
        {n: "Metro TV", u: "https://edge.medcom.id/live-edge/smil:mgnch.smil/playlist.m3u8"},
        {n: "BN Channel", u: "https://flv.intechmedia.net/live/ch112.m3u8"},
        {n: "RTV", u: "https://rtvstream.rtv.co.id:4555/hls/rtv.m3u8"},
        {n: "Rodja TV", u: "https://rodjatv.com/rodjatv/live.m3u8"},
        {n: "Surau TV", u: "https://wahyu1ptv.pages.dev/SurauTV-HD.m3u8"},
        {n: "Madani TV", u: "https://stream.asianastream.com/madani/madanitv.smil/playlist.m3u8"},
        {n: "Bali TV", u: "http://103.180.118.5:9981/stream/channelid/916002722"},
        {n: "Jawa Pos TV", u: "http://122.248.43.242:1935/JAWAPOSTVSBY/_definst_/myStream/playlist.m3u8"},
        {n: "VTV", u: "http://175.158.57.130:8888/stream/channelid/1627810438"},
        {n: "Garuda TV", u: "https://hgmtv.com:19360/garudatvlivestreaming/garudatvlivestreaming.m3u8"},
        {n: "Nusantara TV", u: "https://nusantaratv.siar.us/nusantaratv/live/playlist.m3u8"},
        {n: "TV9 Nusantara", u: "https://5bf7b725107e5.streamlock.net/tv9/tv9/playlist.m3u8"}
    ];

    // Tambahkan TVRI dengan Logo Resmi
    const tvri = ["Nasional", "SportHD", "World", "Jateng", "Jabar", "Jatim", "Jogjakarta", "Bali", "Aceh", "Sumut", "Sulsel"];
    tvri.forEach(id => {
        channels.push({
            n: "TVRI " + id, 
            u: `https://ott-balancer.tvri.go.id/live/eds/${id}/hls/${id}.m3u8`,
            logo: `https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/TVRI_logo_%282019%29.svg/200px-TVRI_logo_%282019%29.svg.png`
        });
    });

    // Inisialisasi
    const player = videojs('tv-player');
    const mainGrid = document.getElementById('mainGrid');
    const searchBar = document.getElementById('searchBar');
    const infoBar = document.getElementById('infoBar');

    function play(url, name) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play();
        infoBar.innerHTML = `Sedang Menonton: <span>${name}</span>`;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Fungsi mendapatkan inisial jika logo tidak ada
    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    }

    function renderChannels(query = "") {
        mainGrid.innerHTML = "";
        const filtered = channels.filter(c => c.n.toLowerCase().includes(query.toLowerCase()));

        filtered.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.tabIndex = 0;

            // Logika Logo: Jika ada logo manual pakai itu, jika tidak buat inisial
            let logoContent = `<div class="logo-box">${getInitials(ch.n)}</div>`;
            if(ch.logo) {
                logoContent = `<div class="logo-box"><img src="${ch.logo}" class="logo-img"></div>`;
            } else if (ch.n.includes("Trans")) {
                logoContent = `<div class="logo-box"><img src="https://upload.wikimedia.org/wikipedia/commons/0/02/Trans_TV_logo.svg" class="logo-img"></div>`;
            }

            card.innerHTML = `
                ${logoContent}
                <div class="channel-name">${ch.n}</div>
            `;

            card.onclick = () => play(ch.u, ch.n);
            card.onkeydown = (e) => { if(e.key === 'Enter') play(ch.u, ch.n); };
            mainGrid.appendChild(card);
        });
    }

    searchBar.addEventListener('input', (e) => renderChannels(e.target.value));

    // Start
    renderChannels();
    play(channels[0].u, channels[0].n);
</script>
</body>
</html>
