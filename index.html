    <style>
        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; --active: #333; --focus: #444; --promo-bg: #ffd700; --download: #007bff; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styles */
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); position: sticky; top: 0; background: var(--sidebar); z-index: 10; text-align: center; }
        
        .download-btn {
            display: flex; align-items: center; justify-content: center; background: var(--download);
            color: white; padding: 12px; margin: 10px; border-radius: 8px; text-decoration: none;
            font-weight: bold; font-size: 13px; transition: 0.3s;
        }
        .download-btn:hover { background: #0056b3; }

        .channel { 
            display: flex; align-items: center; padding: 12px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222; outline: none;
        }
        .channel:hover, .channel.focused { background: var(--focus); border-left: 4px solid var(--primary); }
        .channel.active { background: var(--active); border-left: 4px solid var(--primary); }
        
        .channel img { width: 60px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #fff; }
        .channel h4 { margin: 0; font-size: 14px; font-weight: 500; }

        /* Main Player Styles */
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info-bar { padding: 10px 20px; background: #111; border-bottom: 1px solid #333; }
        #currentTitle { margin: 0; font-size: 16px; color: #eee; }

        .promo-marquee {
            background: var(--promo-bg); color: #000; padding: 8px 0;
            font-weight: bold; font-size: 15px; text-transform: uppercase;
        }
        .promo-marquee a { color: #d00000; text-decoration: none; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>

    <script>
        let currentIndex = 0;
        const channels = document.querySelectorAll('.channel');

        function changeChan(source, name, isYouTube, element) {
            const player = document.getElementById('videoPlayer');
            const titleDisplay = document.getElementById('currentTitle');
            
            // Hapus kelas aktif dari semua channel
            channels.forEach(c => c.classList.remove('active'));
            
            // Set sumber video
            if (isYouTube) {
                player.src = "https://www.youtube.com/embed/" + source + (source.includes('?') ? "&" : "?") + "autoplay=1&rel=0";
            } else {
                player.src = source;
            }
            
            // Update UI
            titleDisplay.innerText = "Sedang Menonton: " + name;
            if(element) element.classList.add('active');
        }

        // Navigasi Keyboard/Remote
        document.addEventListener('keydown', function(e) {
            if (e.key === "ArrowDown") {
                currentIndex = (currentIndex + 1) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (currentIndex !== -1) {
                    channels[currentIndex].click();
                }
            }
        });

        function updateFocus() {
            channels.forEach((c, index) => {
                if (index === currentIndex) {
                    c.classList.add('focused');
                    c.focus(); 
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    c.classList.remove('focused');
                }
            });
        }
    </script>
