<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoStream - TV Online Indonesia</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #141414;
            --card-bg: #2f2f2f;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Player Section */
        .player-container {
            width: 100%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .video-js {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        /* Channel List Section */
        .content {
            padding: 15px;
            overflow-y: auto;
        }

        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--primary-color); }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: 2px solid transparent;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        /* Fokus untuk Remote TV Box & Hover HP */
        .channel-card:hover, .channel-card:focus {
            background: var(--primary-color);
            transform: scale(1.05);
            outline: none;
            border-color: white;
        }

        .active-channel {
            border-color: var(--primary-color);
            background: #444;
        }

        /* Responsive Adjustment for TV Box */
        @media (min-width: 1024px) {
            .channel-grid { grid-template-columns: repeat(6, 1fr); }
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{}'>
        <p class="vjs-no-js">Untuk melihat video ini, aktifkan JavaScript atau gunakan browser yang mendukung HTML5 video.</p>
    </video>
</div>

<div class="content">
    <h2 id="playing-title">Pilih Channel:</h2>
    <div class="channel-grid" id="channel-list">
        </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

<script>
    // Data Channel (Hanya contoh beberapa dari list Anda untuk ringkasnya)
    const channels = [
        { name: "Trans7", url: "https://video.detik.com/trans7/smil:trans7.smil/index.m3u8" },
        { name: "Trans TV", url: "https://video.detik.com/transtv/smil:transtv.smil/index.m3u8" },
        { name: "CNBC Indonesia", url: "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/master.m3u8" },
        { name: "TVRI Nasional", url: "https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8" },
        { name: "Metro Globe", url: "https://edge.medcom.id/live-edge/smil:mgnch.smil/playlist.m3u8" },
        { name: "Indosiar", url: "http://203.77.246.58:4500/udp/239.1.1.110:5000" },
        { name: "SCTV", url: "http://203.77.246.58:4500/udp/239.1.1.108:5000" },
        { name: "Rodja TV", url: "https://rodjatv.com/rodjatv/live.m3u8" },
        { name: "Bali TV", url: "http://103.180.118.5:9981/stream/channelid/916002722" }
        // Anda bisa menambahkan channel lainnya dari list di sini
    ];

    const player = videojs('my-video');
    const listContainer = document.getElementById('channel-list');
    const titleHeader = document.getElementById('playing-title');

    // Fungsi untuk ganti channel
    function playChannel(url, name) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play();
        titleHeader.innerText = "Sedang Memutar: " + name;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Generate Tombol Channel
    channels.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'channel-card';
        div.tabIndex = 0; // Agar bisa difokuskan remote TV
        div.innerText = ch.name;
        
        div.onclick = () => playChannel(ch.url, ch.name);
        
        // Support tombol "Enter" pada Remote TV Box
        div.onkeydown = (e) => {
            if (e.key === 'Enter') playChannel(ch.url, ch.name);
        };

        listContainer.appendChild(div);
    });

    // Putar channel pertama otomatis
    playChannel(channels[0].url, channels[0].name);
</script>

</body>
</html>
