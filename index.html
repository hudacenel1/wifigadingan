<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TV Online Pro</title>
    <style>
        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); }
        
        .channel { 
            display: flex; align-items: center; padding: 15px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222;
        }
        .channel:hover { background: #333; }
        .channel img { width: 60px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #000; }
        .channel h4 { margin: 0; font-size: 14px; }

        /* Area Player */
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        
        /* Iframe Styling */
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info { padding: 20px; background: #111; border-top: 1px solid #333; }
        .info h2 { margin: 0; font-size: 18px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">DAFTAR SALURAN</div>
        
        <div class="channel" onclick="changeChan('yNKvkPJl-tg', 'TV One Live', true)">
            <img src="https://img.youtube.com/vi/yNKvkPJl-tg/mqdefault.jpg">
            <h4>TV One (YouTube)</h4>
        </div>

        <div class="channel" onclick="changeChan('X_7pS9P_E6U', 'Kompas TV Live', true)">
            <img src="https://img.youtube.com/vi/X_7pS9P_E6U/mqdefault.jpg">
            <h4>Kompas TV (YouTube)</h4>
        </div>

        <div class="channel" onclick="changeChan('https://20.detik.com/watch/livestreaming-transtv', 'Trans TV (Detik)', false)">
            <img src="transtv.jpg" style="background: white; padding: 2px;">
            <h4>Trans TV (Detik)</h4>
        </div>
        
        <div class="channel" onclick="changeChan('https://20.detik.com/watch/livestreaming-trans7', 'Trans 7 (Detik)', false)">
            <img src="trans7.jpg" style="background: white; padding: 2px;">
            <h4>Trans 7 (Detik)</h4>
        </div>
    </div>

    <div class="main">
        <div class="player-wrapper">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/yNKvkPJl-tg?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="info">
            <h2 id="title">Sedang Menonton: TV One Live</h2>
            <p>Status: <span style="color: lime;">Online</span></p>
        </div>
    </div>

    <script>
        function changeChan(source, name, isYouTube) {
            const player = document.getElementById('videoPlayer');
            const title = document.getElementById('title');
            
            if (isYouTube) {
                // Jika YouTube, gunakan format embed
                player.src = "https://www.youtube.com/embed/" + source + "?autoplay=1&rel=0";
            } else {
                // Jika link luar (seperti Detik), langsung masukkan URL-nya
                player.src = source;
            }
            
            title.innerText = "Sedang Menonton: " + name;
        }
    </script>
</body>
</html>
