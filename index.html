<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoStream All Channels</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #e50914;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh;
        }

        /* Player Section */
        .player-wrapper {
            position: sticky; top: 0;
            z-index: 1000;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .video-js { width: 100%; aspect-ratio: 16/9; }

        /* Search & Info Section */
        .controls { padding: 15px; background: #1a1a1a; }
        
        #searchBar {
            width: 100%; padding: 12px;
            border-radius: 8px; border: none;
            background: #333; color: white;
            font-size: 1rem; box-sizing: border-box;
        }

        .info-text { margin-top: 10px; font-weight: bold; color: var(--primary); }

        /* Grid Section */
        .container { flex: 1; overflow-y: auto; padding: 15px; }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .card {
            background: var(--card);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            min-height: 50px;
            word-break: break-word;
        }

        .card:focus, .card:hover {
            background: var(--primary);
            transform: scale(1.05);
            outline: none;
            border-color: #fff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        @media (min-width: 1024px) {
            .channel-grid { grid-template-columns: repeat(8, 1fr); }
        }
    </style>
</head>

        rawChannels.push({ n: "TVRI " + reg, u: `https://ott-balancer.tvri.go.id/live/eds/${reg}/hls/${reg}.m3u8` });
    });

    const player = videojs('tv-player');
    const channelList = document.getElementById('channel-list');
    const nowPlayingText = document.getElementById('now-playing');
    const searchBar = document.getElementById('searchBar');

    function play(url, name) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play();
        nowPlayingText.innerText = "Memutar: " + name;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderChannels(filter = "") {
        channelList.innerHTML = "";
        const filtered = rawChannels.filter(c => c.n.toLowerCase().includes(filter.toLowerCase()));
        
        filtered.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'card';
            card.tabIndex = 0;
            card.innerText = ch.n;
            card.onclick = () => play(ch.u, ch.n);
            card.onkeydown = (e) => { if(e.key === 'Enter') play(ch.u, ch.n); };
            channelList.appendChild(card);
        });
    }

    searchBar.oninput = (e) => renderChannels(e.target.value);

    // Jalankan awal
    renderChannels();
    play(rawChannels[0].u, rawChannels[0].n);
