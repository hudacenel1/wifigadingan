<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoStream Pro - TV Box Edition</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #ff0000;
            --bg: #0f0f0f;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --accent: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* Video Player Section */
        .player-container {
            width: 100%;
            background: #000;
            position: sticky; top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.9);
        }
        .video-js { width: 100%; aspect-ratio: 16/9; }

        /* UI Bar */
        .ui-bar {
            padding: 10px 15px;
            background: #1a1a1a;
            border-bottom: 1px solid var(--accent);
        }
        .now-playing { font-size: 14px; margin-bottom: 8px; color: #bbb; }
        .now-playing span { color: var(--primary); font-weight: bold; }

        #searchBar {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: #252525;
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        #searchBar:focus { border-color: var(--primary); }

        /* Grid Channel */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px; /* Extra space for scrolling */
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }

        /* Card Style */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
        }
        .card:hover, .card:focus {
            background: #2a2a2a;
            border-color: var(--primary);
            transform: scale(1.05);
            outline: none;
        }

        .logo-box {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #222, #333);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 20px;
            color: #666;
            overflow: hidden;
        }
        .logo-box img { max-width: 80%; max-height: 80%; object-fit: contain; }

        .name-box {
            font-size: 12px;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 32px;
        }

        @media (min-width: 768px) {
            .channel-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .logo-box { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

<div class="player-container">
    <video id="main-player" class="video-js vjs-big-play-centered" controls preload="auto"></video>
</div>

<div class="ui-bar">
    <div class="now-playing" id="status">Pilih Channel...</div>
    <input type="text" id="searchBar" placeholder="Cari nama channel atau kota...">
</div>

<div class="content-area">
    <div class="channel-grid" id="channelList"></div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

<script>
    // DATA SEMUA CHANNEL (Full List)
    const channelData = [
        {n: "Trans7", u: "https://video.detik.com/trans7/smil:trans7.smil/index.m3u8"},
        {n: "Trans TV", u: "https://video.detik.com/transtv/smil:transtv.smil/index.m3u8"},
        {n: "RCTI", u: "https://allcutv.rctiplus.id/rcti2023.m3u8"},
        {n: "MNCTV", u: "https://allcutv.rctiplus.id/mnctv2023.m3u8"},
        {n: "GTV", u: "http://203.77.246.58:4500/udp/239.1.3.68:5000"},
        {n: "iNews", u: "https://allcutv.rctiplus.id/inews2023.m3u8"},
        {n: "SCTV", u: "http://203.77.246.58:4500/udp/239.1.1.108:5000"},
        {n: "Indosiar", u: "http://203.77.246.58:4500/udp/239.1.1.110:5000"},
        {n: "CNBC Indonesia", u: "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/master.m3u8"},
        {n: "Metro TV", u: "https://edge.medcom.id/live-edge/smil:mgnch.smil/playlist.m3u8"},
        {n: "RTV", u: "https://rtvstream.rtv.co.id:4555/hls/rtv.m3u8"},
        {n: "Nusantara TV", u: "https://nusantaratv.siar.us/nusantaratv/live/playlist.m3u8"},
        {n: "Rodja TV", u: "https://rodjatv.com/rodjatv/live.m3u8"},
        {n: "Al-Iman TV", u: "https://tv.aliman.id/aliman/live.m3u8"},
        {n: "Surau TV", u: "https://wahyu1ptv.pages.dev/SurauTV-HD.m3u8"},
        {n: "Madani TV", u: "https://stream.asianastream.com/madani/madanitv.smil/playlist.m3u8"},
        {n: "Bali TV", u: "http://103.180.118.5:9981/stream/channelid/916002722"},
        {n: "Jawa Pos TV", u: "http://122.248.43.242:1935/JAWAPOSTVSBY/_definst_/myStream/playlist.m3u8"},
        {n: "JTV Surabaya", u: "http://122.248.43.242:1935/JTVSURABAYA/_definst_/myStream/playlist.m3u8"},
        {n: "Bandung TV", u: "http://202.150.153.254:65500/bandungtvWEBSITE.m3u8"},
        {n: "Arek TV", u: "https://ams.juraganstreaming.com:5443/LiveApp/streams/arektv.m3u8"},
        {n: "Ashiil TV", u: "https://wahyu1ptv.pages.dev/AshiilTV-HD.m3u8"},
        {n: "BN Channel", u: "https://flv.intechmedia.net/live/ch112.m3u8"},
        {n: "Garuda TV", u: "https://hgmtv.com:19360/garudatvlivestreaming/garudatvlivestreaming.m3u8"},
        {n: "BTV", u: "https://btv.secureswiftcontent.com/han/btv/btv10005/srtoutput/manifest.m3u8"},
        {n: "Jogja TV", u: "https://stream.jogjatv.co.id/jtvlive/stream/index.m3u8"},
        {n: "Surabaya TV", u: "https://e.siar.us/live/surabayatv.m3u8"},
        {n: "TV9 Nusantara", u: "https://5bf7b725107e5.streamlock.net/tv9/tv9/playlist.m3u8"},
        {n: "Zee Bioskop", u: "http://103.180.118.5:9981/stream/channelid/789671189"},
        {n: "VTV", u: "http://175.158.57.130:8888/stream/channelid/1627810438"}
    ];

    // Tambahkan TVRI Regional Otomatis
    const tvriReg = ["Nasional", "SportHD", "World", "Aceh", "Sumut", "Sumbar", "Riau", "Jambi", "Sumsel", "Bengkulu", "Lampung", "Babel", "DKI", "Jabar", "Jateng", "Jogjakarta", "Jatim", "Bali", "NTB", "NTT", "Kalbar", "Kalteng", "Kalsel", "Kaltim", "Sulut", "Sulteng", "Sulsel", "Sultra", "Gorontalo", "Sulbar", "Ambon", "Pabar", "Papua"];
    tvriReg.forEach(reg => {
        channelData.push({ n: "TVRI " + reg, u: `https://ott-balancer.tvri.go.id/live/eds/${reg}/hls/${reg}.m3u8` });
    });

    // Inisialisasi Player
    const player = videojs('main-player');
    const grid = document.getElementById('channelList');
    const search = document.getElementById('searchBar');
    const status = document.getElementById('status');

    function playChannel(url, name) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play().catch(e => console.log("User interaction required"));
        status.innerHTML = `Sedang Memutar: <span>${name}</span>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getInitials(name) {
        return name.split(' ').map(x => x[0]).join('').substring(0, 2).toUpperCase();
    }

    function render(query = "") {
        grid.innerHTML = "";
        const filtered = channelData.filter(c => c.n.toLowerCase().includes(query.toLowerCase()));
        
        filtered.forEach(ch => {
            const card = document.createElement('div');
            card.className = "card";
            card.tabIndex = 0;

            // Logo logic
            let logoHTML = `<div class="logo-box">${getInitials(ch.n)}</div>`;
            if (ch.n.includes("TVRI")) {
                logoHTML = `<div class="logo-box"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/TVRI_logo_%282019%29.svg/200px-TVRI_logo_%282019%29.svg.png"></div>`;
            } else if (ch.n.includes("Trans")) {
                logoHTML = `<div class="logo-box"><img src="https://upload.wikimedia.org/wikipedia/commons/0/02/Trans_TV_logo.svg"></div>`;
            }

            card.innerHTML = `${logoHTML}<div class="name-box">${ch.n}</div>`;
            
            card.onclick = () => playChannel(ch.u, ch.n);
            card.onkeydown = (e) => { if(e.key === "Enter") playChannel(ch.u, ch.n); };
            
            grid.appendChild(card);
        });
    }

    // --- FITUR ANTI-KELUAR (BACK BUTTON) ---
    window.history.pushState({page: 1}, "", "");
    window.onpopstate = function() {
        if (search.value !== "") {
            search.value = "";
            render();
            window.history.pushState({page: 1}, "", "");
        } else {
            const keluar = confirm("Keluar dari aplikasi TV?");
            if (keluar) {
                window.history.back();
            } else {
                window.history.pushState({page: 1}, "", "");
            }
        }
    };

    search.addEventListener('input', (e) => render(e.target.value));
    
    // Start Up
    render();
    playChannel(channelData[0].u, channelData[0].n);
</script>

</body>
</html>
