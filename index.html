<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IndoTV Ringan</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #ff3d00; --dark: #000000; --gray: #1a1a1a; --accent: #2979ff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: white; margin: 0; padding-bottom: 30px; }
        
        /* Video Player */
        .video-container { position: sticky; top: 0; z-index: 1000; background: #000; width: 100%; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; }

        /* Panel Kontrol */
        .control-panel { padding: 10px; background: #222; display: flex; gap: 10px; align-items: center; }
        button.refresh { background: var(--accent); border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .status-text { font-size: 12px; color: #aaa; flex-grow: 1; }

        /* Pencarian */
        .search-container { padding: 10px; }
        #search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: var(--gray); color: white; outline: none; }

        /* Grid Saluran */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; }
        .card { background: var(--gray); border-radius: 10px; padding: 15px 5px; text-align: center; cursor: pointer; border: 1px solid #333; transition: 0.2s; }
        .card:active { background: #333; transform: scale(0.95); border-color: var(--accent); }
        .card-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .card-group { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .footer-note { text-align: center; font-size: 10px; color: #444; margin-top: 20px; }
    </style>
</head>
<body>

<div class="video-container">
    <video id="video" controls autoplay playsinline></video>
</div>

<div class="control-panel">
    <div class="status-text" id="status">Pilih saluran di bawah</div>
    <button class="refresh" onclick="refreshStream()">🔄 REFRESH</button>
</div>

<div class="search-container">
    <input type="text" id="search" placeholder="Cari TV (Contoh: RCTI, TVRI)...">
</div>

<div class="grid" id="channel-list"></div>

<div class="footer-note">Mode Hemat Kuota: Selalu mencoba kualitas terendah agar lancar.</div>

<script>
    // DATA CHANNEL TERBARU ANDA
    const channels = [
        { name: "RCTI", url: "https://allcutv.rctiplus.id/rcti2023.m3u8", group: "Nasional" },
        { name: "MNCTV", url: "https://allcutv.rctiplus.id/mnctv2023.m3u8", group: "Nasional" },
        { name: "GTV", url: "http://203.77.246.58:4500/udp/239.1.3.68:5000", group: "Nasional" },
        { name: "iNews", url: "https://allcutv.rctiplus.id/inews2023.m3u8", group: "Nasional" },
        { name: "Trans 7", url: "https://video.detik.com/trans7/smil:trans7.smil/index.m3u8", group: "Nasional" },
        { name: "Trans TV", url: "https://video.detik.com/transtv/smil:transtv.smil/index.m3u8", group: "Nasional" },
        { name: "Indosiar", url: "http://203.77.246.58:4500/udp/239.1.1.110:5000", group: "Nasional" },
        { name: "SCTV", url: "http://203.77.246.58:4500/udp/239.1.1.108:5000", group: "Nasional" },
        { name: "Metro Globe", url: "https://edge.medcom.id/live-edge/smil:mgnch.smil/playlist.m3u8", group: "Berita" },
        { name: "CNBC Indo", url: "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/master.m3u8", group: "Berita" },
        { name: "Nusantara TV", url: "https://nusantaratv.siar.us/nusantaratv/live/playlist.m3u8", group: "Nasional" },
        { name: "TVRI Nasional", url: "https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8", group: "TVRI" },
        { name: "TVRI Sport", url: "https://ott-balancer.tvri.go.id/live/eds/SportHD/hls/SportHD.m3u8", group: "TVRI" },
        { name: "TVRI Jateng", url: "https://ott-balancer.tvri.go.id/live/eds/Jateng/hls/Jateng.m3u8", group: "Regional" },
        { name: "TVRI Jatim", url: "https://ott-balancer.tvri.go.id/live/eds/Jatim/hls/Jatim.m3u8", group: "Regional" },
        { name: "TVRI Jabar", url: "https://ott-balancer.tvri.go.id/live/eds/Jabar/hls/Jabar.m3u8", group: "Regional" },
        { name: "Rodja TV", url: "https://rodjatv.com/rodjatv/live.m3u8", group: "Religi" },
        { name: "Garuda TV", url: "https://hgmtv.com:19360/garudatvlivestreaming/garudatvlivestreaming.m3u8", group: "Nasional" },
        { name: "Bali TV", url: "http://103.180.118.5:9981/stream/channelid/916002722", group: "Daerah" },
        { name: "Surabaya TV", url: "https://e.siar.us/live/surabayatv.m3u8", group: "Daerah" }
    ];

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let currentUrl = "";
    let hls = null;

    function playStream(url, name) {
        currentUrl = url;
        status.innerText = "📺 " + name;

        if (hls) { hls.destroy(); }

        if (Hls.isSupported()) {
            hls = new Hls({
                startLevel: 0, // Mulai dari kualitas PALING RENDAH (agar tidak macet)
                capLevelToPlayerSize: true,
                autoStartLoad: true
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {
                    status.innerText = "Klik Play pada Video";
                });
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function refreshStream() {
        if (currentUrl) {
            playStream(currentUrl, status.innerText.replace("📺 ", ""));
        }
    }

    function renderList(filter = "") {
        const list = document.getElementById('channel-list');
        list.innerHTML = "";
        const filtered = channels.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
        
        filtered.forEach(c => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-group">${c.group}</div>
                <div class="card-name">${c.name}</div>
            `;
            card.onclick = () => playStream(c.url, c.name);
            list.appendChild(card);
        });
    }

    document.getElementById('search').oninput = (e) => renderList(e.target.value);
    renderList();
</script>

</body>
</html>
