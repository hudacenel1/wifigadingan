<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - Mobile & TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-color: #ffcc00; 
            --sidebar-width: 240px;
            --bg-dark: #0f0f0f;
            --card-bg: #1e1e1e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            flex-direction: row; /* Default samping untuk TV/PC */
        }

        /* --- SIDEBAR (TV/PC) --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-logo { width: 120px; margin: 0 auto 30px; display: block; }

        .menu-item {
            padding: 15px 25px;
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }

        .menu-item:focus, .menu-item.active {
            background: rgba(255,204,0,0.1);
            color: var(--accent-color);
            outline: none;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px; /* Ruang untuk navbar HP */
        }

        .player-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            width: 100%;
            margin-bottom: 25px;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .chan-card:focus, .chan-card:active {
            border-color: var(--accent-color);
            transform: scale(0.95);
        }

        .chan-card img {
            width: 100%;
            height: 50px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .chan-name { font-size: 0.85rem; }

        /* --- RESPONSIVE UNTUK HP (ANDROID) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; } /* Tumpuk ke bawah */

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                position: fixed;
                bottom: 0; /* Pindah ke bawah seperti App modern */
                border-right: none;
                border-top: 1px solid #222;
                padding: 5px 0;
                justify-content: space-around;
            }

            .brand-container, .wa-section, .btn-outline-warning {
                display: none; /* Sembunyikan elemen berat di HP */
            }

            .menu-item {
                flex-direction: column;
                gap: 5px;
                font-size: 0.7rem;
                padding: 10px;
                flex: 1;
                text-align: center;
            }

            .menu-item i { font-size: 1.2rem; }

            .main-content { padding: 10px; }
            
            .grid-channels {
                grid-template-columns: repeat(2, 1fr); /* 2 kolom di HP */
            }
        }
    </style>
</head>
