<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TV Online Streaming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #000;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        header {
            background: #111;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .player-container {
            max-width: 100%;
            margin: auto;
        }

        video {
            width: 100%;
            height: auto;
        }

        .channel-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            padding: 10px;
            background: #111;
        }

        .channel {
            background: #222;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .channel:hover {
            background: #0d6efd;
        }
    </style>
</head>
<body>

<header>📺 TV ONLINE STREAMING</header>

<div class="player-container">
    <video
        id="tvPlayer"
        class="video-js vjs-default-skin"
        controls
        autoplay
        preload="auto"
        data-setup='{
            "fluid": true
        }'>
        <source src="https://video.detik.com/trans7/smil:trans7.smil/index.m3u8" type="application/x-mpegURL">
    </video>
</div>

<div class="channel-list">

    <div class="channel" onclick="changeChannel('http://203.77.246.58:4500/udp/239.1.3.68:5000')">
        TRANS7
    </div>

    <div class="channel" onclick="changeChannel('http://203.77.246.58:4500/udp/239.1.1.108:5000')">
        Channel Demo 1
    </div>

    <div class="channel" onclick="changeChannel('https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8')">
        Channel Demo 2
    </div>

    <div class="channel" onclick="changeChannel('https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8')">
        Channel Demo 3
    </div>

</div>

<!-- Video.js -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
    const player = videojs('tvPlayer');

    function changeChannel(url) {
        player.src({
            src: url,
            type: 'application/x-mpegURL'
        });
        player.play();
    }
</script>

</body>
</html>
