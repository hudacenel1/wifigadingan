<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo WiFi - TV Edition</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1f1f1f;
            --accent: #00e676;
            --text-color: #ffffff;
            --focus-border: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            overflow: hidden; /* Mencegah scroll yang tidak perlu pada TV */
        }

        h1 { text-align: center; font-size: 3rem; margin-bottom: 10px; }
        p.subtitle { text-align: center; font-size: 1.5rem; color: #bbb; margin-bottom: 40px; }

        /* Grid Layout Utama */
        .grid-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* Styling Kartu untuk Navigasi Remote */
        .nav-item {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            width: 320px;
            text-align: center;
            border: 4px solid transparent;
            transition: all 0.2s ease-in-out;
            outline: none; /* Menghilangkan outline default browser */
            cursor: pointer;
        }

        /* EFEK FOKUS - Ini yang terpenting untuk TV */
        .nav-item:focus {
            border-color: var(--focus-border);
            transform: scale(1.1); /* Efek zoom saat dipilih */
            background-color: #333;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .price {
            display: block;
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: bold;
            margin: 20px 0;
        }

        .speed { font-size: 1.2rem; color: #aaa; }

        /* Daftar Situs di Bagian Bawah */
        .site-container {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .site-button {
            background: #2c2c2c;
            padding: 15px 30px;
            border-radius: 10px;
            border: 3px solid transparent;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            outline: none;
        }

        .site-button:focus {
            background: var(--accent);
            color: black;
            border-color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>PROMO INTERNET TV</h1>
    <p class="subtitle">Gunakan tombol arah pada remote untuk memilih paket</p>

    <div class="grid-container">
        <div class="nav-item" tabindex="0">
            <h2>PAKET HEMAT</h2>
            <span class="speed">20 Mbps</span>
            <span class="price">150rb</span>
            <p>Cocok untuk Streaming HD</p>
        </div>

        <div class="nav-item" tabindex="0">
            <h2>PAKET JOSS</h2>
            <span class="speed">50 Mbps</span>
            <span class="price">300rb</span>
            <p>Lancar untuk 5 Perangkat</p>
        </div>

        <div class="nav-item" tabindex="0">
            <h2>PAKET GAMER</h2>
            <span class="speed">100 Mbps</span>
            <span class="price">450rb</span>
            <p>Ping Rendah & Stabil</p>
        </div>
    </div>

    <div class="site-container">
        <a href="https://fast.com" class="site-button" tabindex="0">Cek Speed</a>
        <a href="https://youtube.com" class="site-button" tabindex="0">Buka YouTube</a>
        <a href="#" class="site-button" tabindex="0">Hubungi Kami</a>
    </div>

    <script>
        // Script sederhana agar saat halaman dimuat, fokus langsung ke kartu pertama
        window.onload = function() {
            document.querySelector('.nav-item').focus();
        };
    </script>

</body>
</html>
