        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; --active: #333; --focus: #444; --promo: #ffd700; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); position: sticky; top: 0; background: var(--sidebar); z-index: 10; }
        
        /* Gaya Banner Promosi Wifi */
        .promo-banner {
            background: var(--promo);
            color: #000;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: transform 0.2s;
        }
        .promo-banner:hover { transform: scale(1.02); }
        .promo-banner h3 { margin: 0; font-size: 16px; font-weight: bold; }
        .promo-banner p { margin: 5px 0; font-size: 14px; font-weight: bold; }
        .promo-banner .wa-btn { background: #25d366; color: white; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 5px; font-size: 12px; }

        .channel-container { flex: 1; overflow-y: auto; }
        .channel { 
            display: flex; align-items: center; padding: 15px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222; outline: none;
        }
        .channel:hover, .channel.focused { background: var(--focus); border-left: 4px solid var(--primary); }
        .channel.active { background: var(--active); border-left: 4px solid var(--primary); }
        
        .channel img { width: 60px; height: 35px; object-fit: cover; border-radius: 4px; margin-right: 12px; background: #000; }
        .channel h4 { margin: 0; font-size: 14px; text-transform: uppercase; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        #videoPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .info { padding: 20px; background: #111; border-top: 1px solid #333; }
        .instruction { font-size: 12px; color: #888; margin-top: 5px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>

    <div class="main">
        <div class="player-wrapper">
            <iframe id="videoPlayer" src="https://www.youtube.com/embed/yNKvkPJl-tg?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="info">

        </div>
    </div>

    <script>
        let currentIndex = -1;
        const channels = document.querySelectorAll('.channel');

        function changeChan(source, name, isYouTube, element) {
            const player = document.getElementById('videoPlayer');
            const title = document.getElementById('title');
            
            channels.forEach(c => c.classList.remove('active'));
            
            if (isYouTube) {
                player.src = "https://www.youtube.com/embed/" + source + (source.includes('?') ? "&" : "?") + "autoplay=1&rel=0";
            } else {
                player.src = source;
            }
            
            title.innerText = "Sedang Menonton: " + name;
            
            if(element) {
                element.classList.add('active');
            }
        }

        // Remote Keyboard
        document.addEventListener('keydown', function(e) {
            if (e.key === "ArrowDown") {
                currentIndex = (currentIndex + 1) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentIndex = (currentIndex - 1 + channels.length) % channels.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (currentIndex !== -1) {
                    channels[currentIndex].click();
                }
            }
        });

        function updateFocus() {
            channels.forEach((c, index) => {
                if (index === currentIndex) {
                    c.classList.add('focused');
                    c.focus(); 
                    c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    c.classList.remove('focused');
                }
            });
        }
    </script>
