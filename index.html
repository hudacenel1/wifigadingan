<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFI GADINGAN - Premium Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --accent-color: #ffcc00; 
            --sidebar-width: 260px;
            --bg-dark: #0a0a0a;
            --card-bg: #1a1a1a;
            --focus-bg: rgba(255, 204, 0, 0.15);
        }

        body { 
            background-color: var(--bg-dark); 
            color: #fff; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 30px 0;
            flex-shrink: 0;
        }

        .brand-container { padding: 0 25px 40px; }
        .brand-logo { width: 100%; max-width: 160px; height: auto; }

        .menu-item {
            padding: 16px 28px;
            color: #888;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            border-left: 5px solid transparent;
        }

        /* Fokus State */
        .menu-item:focus, .chan-card:focus {
            outline: none;
            background: var(--focus-bg);
            border-left-color: var(--accent-color);
            color: #fff;
            transform: translateX(5px);
        }

        .menu-item.active { color: var(--accent-color); font-weight: bold; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            scroll-behavior: smooth;
        }

        .player-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            margin-bottom: 40px;
            border: 2px solid #222;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .chan-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: white;
            display: block;
        }

        .chan-card:focus {
            transform: scale(1.08);
            border-color: var(--accent-color);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            background: #252525;
        }

        .chan-card img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        .chan-name { font-size: 1rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-container">
            <img src="gajah.png" alt="WIFI GADINGAN" class="brand-logo">
        </div>
        
        <nav id="sidebar-nav">
            <a href="#" class="menu-item active" tabindex="1"><i class="bi bi-house-door"></i> Home</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-tv"></i> Live TV</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-trophy"></i> Sports</a>
            <a href="#" class="menu-item" tabindex="1"><i class="bi bi-film"></i> Movies</a>
        </nav>

        <div style="margin-top: auto; padding: 25px; border-top: 1px solid #222;">
            <div class="text-success mb-3" style="font-size: 0.9rem;">
                <i class="bi bi-whatsapp"></i> Support:<br>
                <strong>089632950308</strong>
            </div>
            <button class="btn btn-outline-warning btn-sm w-100" onclick="location.reload()">Refresh App</button>
        </div>
    </div>

    <div class="main-content" id="main-scroll">
        <div class="player-container">
            <iframe id="main-player" 
                src="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==" 
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
        </div>

        <h3 class="mb-4">Saluran TV Nasional</h3>

        <div class="grid-channels">
            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/GTV_Logo_2022.svg/1200px-GTV_Logo_2022.svg.png" loading="lazy">
                <div class="chan-name">GTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/MNCTV_logo_2015.svg/1200px-MNCTV_logo_2015.svg.png" loading="lazy">
                <div class="chan-name">MNCTV</div>
            </a>

            <a href="javascript:void(0)" class="chan-card" tabindex="2" onclick="playChan('https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/INews_2023.svg/1200px-INews_2023.svg.png" loading="lazy">
                <div class="chan-name">iNews</div>
            </a>
        </div>
    </div>

    <script>
        const player = document.getElementById('main-player');
        const scrollArea = document.getElementById('main-scroll');

        function playChan(url) {
            player.src = url;
            scrollArea.scrollTo({top: 0, behavior: 'smooth'});
        }

        // Navigasi Remote TV yang diperbaiki
        document.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            const cards = Array.from(document.querySelectorAll('.chan-card'));
            const menus = Array.from(document.querySelectorAll('.menu-item'));
            const currentIndex = cards.indexOf(active);

            switch(e.key) {
                case "ArrowRight":
                    if (menus.includes(active)) {
                        cards[0].focus();
                    } else if (currentIndex < cards.length - 1) {
                        cards[currentIndex + 1].focus();
                    }
                    break;
                case "ArrowLeft":
                    if (currentIndex === 0 || (currentIndex % 4 === 0)) { // Jika di kolom pertama
                        document.querySelector('.menu-item.active').focus();
                    } else if (currentIndex > 0) {
                        cards[currentIndex - 1].focus();
                    }
                    break;
                case "ArrowDown":
                    if (menus.includes(active)) {
                        const menuIdx = menus.indexOf(active);
                        if (menuIdx < menus.length - 1) menus[menuIdx + 1].focus();
                    } else if (currentIndex + 4 < cards.length) {
                        cards[currentIndex + 4].focus();
                    }
                    break;
                case "ArrowUp":
                    if (menus.includes(active)) {
                        const menuIdx = menus.indexOf(active);
                        if (menuIdx > 0) menus[menuIdx - 1].focus();
                    } else if (currentIndex - 4 >= 0) {
                        cards[currentIndex - 4].focus();
                    }
                    break;
                case "Enter":
                    if (active.click) active.click();
                    break;
            }
        });

        window.onload = () => {
            document.querySelector('.menu-item.active').focus();
        };
    </script>
</body>
</html>
