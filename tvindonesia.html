<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putar Video YouTube</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .video-container {
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Live Stream suro vision</h1>
    
    <div class="video-container">
        <iframe 
            width="800" 
            height="450" 
            src="https://www.youtube.com/embed/PYXT0mwHq4s" 
            title="Live Stream suro vision" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <p>Video dari saluran: <strong>suro vision</strong></p>

</body>
</html>
