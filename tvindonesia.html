<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV GADINGAN HLS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --primary:#007bff;
  --focus:#ffc107;
}
body{
  background:#f0f2f5;
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Segoe UI;
}
.container-fluid{
  max-width:1600px;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
}
.video-wrapper{
  position:relative;
  border-radius:15px;
  overflow:hidden;
  background:black;
}
video{
  width:100%;
  height:100%;
  max-height:70vh;
  background:black;
}
#overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:10;
}
.channel-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  max-height:70vh;
  overflow-y:auto;
}
.channel-card{
  border:4px solid #e9ecef;
  border-radius:15px;
  padding:15px;
  text-align:center;
  cursor:pointer;
}
.channel-card:focus{
  outline:none;
  border-color:var(--focus);
  background:var(--primary);
  color:white;
  transform:scale(1.05);
}
.channel-card img{
  width:100px;
  height:60px;
  object-fit:contain;
}
#notify{
  position:absolute;
  top:30px;
  right:30px;
  font-size:4rem;
  background:black;
  color:var(--focus);
  padding:10px 30px;
  border-radius:15px;
  display:none;
  border:4px solid var(--focus);
}
::-webkit-scrollbar{width:0}
</style>
</head>

<body>

<div id="notify">01</div>

<div class="container-fluid">
<div class="row">

<!-- PLAYER -->
<div class="col-lg-7">
<div class="video-wrapper">
<div id="overlay" tabindex="1" onclick="startTV()">
<h1>TV GADINGAN</h1>
<p>Tekan OK / Enter</p>
</div>
<video id="player" controls autoplay></video>
</div>
<h3 id="title" class="mt-3 text-primary">Pilih Saluran</h3>
</div>

<!-- CHANNEL LIST -->
<div class="col-lg-5">
<h4 class="fw-bold mb-3">DAFTAR CHANNEL</h4>

<div class="channel-grid">

<div class="channel-card" tabindex="2"
 data-num="1"
 onclick="playChannel('RCTI','https://example.com/rcti.m3u8')">
<img src="logotv/rcti.jpg">
<div>1. RCTI</div>
</div>

<div class="channel-card" tabindex="3"
 data-num="2"
 onclick="playChannel('GTV','https://example.com/gtv.m3u8')">
<img src="logotv/gtv.jpg">
<div>2. GTV</div>
</div>

<div class="channel-card" tabindex="4"
 data-num="3"
 onclick="playChannel('MNCTV','https://example.com/mnctv.m3u8')">
<img src="logotv/mnctv.jpg">
<div>3. MNCTV</div>
</div>

<div class="channel-card" tabindex="5"
 data-num="4"
 onclick="playChannel('iNews','https://example.com/inews.m3u8')">
<img src="logotv/inewtv.jpg">
<div>4. iNews</div>
</div>

</div>
</div>

</div>
</div>

<script>
let hls;
const video = document.getElementById('player');

function showNotify(num){
  const n=document.getElementById('notify');
  n.innerText=num.toString().padStart(2,'0');
  n.style.display='block';
  setTimeout(()=>n.style.display='none',2000);
}

function playChannel(name,url){
  document.getElementById('overlay').style.display='none';
  document.getElementById('title').innerText='Menonton: '+name;

  if(hls){hls.destroy();}

  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
  }else{
    hls=new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  }
  video.play();
}

function startTV(){
  const first=document.querySelector('.channel-card');
  first.focus();
  first.click();
}

document.addEventListener('keydown',e=>{
  const items=[document.getElementById('overlay'),...document.querySelectorAll('.channel-card')];
  let i=items.indexOf(document.activeElement);

  if(e.key>='1'&&e.key<='9'){
    const t=document.querySelector(`[data-num="${e.key}"]`);
    if(t){t.focus();t.click();showNotify(e.key);}
    return;
  }

  if(e.key==='ArrowDown') i+=2;
  if(e.key==='ArrowUp') i-=2;
  if(e.key==='ArrowRight') i++;
  if(e.key==='ArrowLeft') i--;
  if(e.key==='Enter') document.activeElement.click();

  if(items[i]){items[i].focus();e.preventDefault();}
});

window.onload=()=>document.getElementById('overlay').focus();
</script>

</body>
</html>
