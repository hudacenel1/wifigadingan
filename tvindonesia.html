<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFIGadingan Smart TV - Ultra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f8f9fa;
            --focus-border: #ffc107;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-light); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .container-fluid {
            max-width: 100%;
            height: 95vh;
            padding: 20px;
        }

        /* --- VIDEO PLAYER --- */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        #videoOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; color: white;
            text-align: center;
        }

        /* --- OSD NOTIFICATION --- */
        #channelNotify {
            position: absolute; top: 40px; right: 40px;
            background: rgba(255, 193, 7, 0.9);
            color: #000;
            padding: 10px 30px;
            border-radius: 10px;
            font-size: 3rem; font-weight: bold;
            display: none; z-index: 1000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- CHANNEL LIST --- */
        .sidebar {
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-right: 10px;
            padding-bottom: 50px;
        }

        .channel-card {
            background: var(--card-bg);
            padding: 15px 5px;
            text-align: center;
            border-radius: 12px;
            border: 3px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .channel-logo {
            width: 80%;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: brightness(0.9);
        }

        .channel-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- FOCUS SYSTEM --- */
        .channel-card:focus, .btn-back:focus, #videoOverlay:focus {
            outline: none;
            border-color: var(--focus-border);
            background-color: var(--primary-color);
            transform: scale(1.05);
            z-index: 10;
        }

        .active-watching {
            border-color: #198754 !important;
            background-color: #0a3622 !important;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 3px solid transparent;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

<script>
    let notifyTimeout;

    function showNotification(num) {
        const notifyEl = document.getElementById('channelNotify');
        notifyEl.innerText = num.toString().padStart(2, '0');
        notifyEl.style.display = 'block';
        clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => {
            notifyEl.style.display = 'none';
        }, 3000);
    }

    function changeChannel(name, url) {
        document.getElementById('videoOverlay').style.display = 'none';
        const player = document.getElementById('mainPlayer');
        
        // Tambahkan parameter autoplay
        const separator = url.includes('?') ? '&' : '?';
        player.src = url + separator + "autoplay=1&mute=0";
        
        document.getElementById('channelTitle').innerText = "MENONTON: " + name;

        // Update UI Focus
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-watching'));
        const current = Array.from(document.querySelectorAll('.channel-card')).find(c => c.innerText.includes(name));
        if (current) {
            current.classList.add('active-watching');
            showNotification(current.getAttribute('data-num'));
        }
    }

    function startExperience() {
        document.getElementById('videoOverlay').style.display = 'none';
        const firstChannel = document.querySelector('.channel-card');
        if (firstChannel) {
            firstChannel.focus();
            firstChannel.click();
        }
    }

    // Remote Navigation Logic
    document.addEventListener('keydown', function(e) {
        const focusables = Array.from(document.querySelectorAll('#backBtn, #videoOverlay, .channel-card'));
        let index = focusables.indexOf(document.activeElement);

        // Angka 0-9 langsung ganti channel
        if (e.key >= '0' && e.key <= '9') {
            const target = document.querySelector(`[data-num="${e.key}"]`);
            if (target) {
                target.focus();
                target.click();
            }
            return;
        }

        let nextIndex;
        const cols = 2; // Grid di sebelah kanan

        switch (e.key) {
            case 'ArrowRight': 
                if (index === 0 || index === 1) nextIndex = 2; // Dari kiri ke grid
                else nextIndex = index + 1; 
                break;
            case 'ArrowLeft': 
                if (index % 2 === 0 && index > 1) nextIndex = 0; // Dari grid kiri ke tombol Back
                else nextIndex = index - 1; 
                break;
            case 'ArrowDown': 
                nextIndex = (index <= 1) ? index + 1 : index + cols; 
                break;
            case 'ArrowUp': 
                nextIndex = (index <= 2) ? 0 : index - cols; 
                break;
            case 'Enter':
                if (document.activeElement) document.activeElement.click();
                return;
            case 'Escape':
            case 'Backspace':
                // Untuk Smart TV, backspace sering digunakan untuk kembali
                if (document.activeElement.tagName !== 'INPUT') {
                    window.history.back();
                }
                return;
        }

        if (nextIndex >= 0 && nextIndex < focusables.length) {
            focusables[nextIndex].focus();
            
            // Auto Scroll
            const active = focusables[nextIndex];
            if (active.classList.contains('channel-card')) {
                active.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            e.preventDefault();
        }
    });

    window.onload = () => {
        document.getElementById('videoOverlay').focus();
    };
</script>
