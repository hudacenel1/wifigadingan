<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV INDONESIA - GADINGAN TV</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        :root { --primary: #ff0000; --bg: #0a0a0a; --sidebar: #1a1a1a; --active: #333; --focus: #444; }
        
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar - Disamakan dengan Portal Utama */
        .sidebar { width: 300px; background: var(--sidebar); overflow-y: auto; border-right: 1px solid #333; }
        .header { padding: 20px; font-weight: bold; font-size: 20px; border-bottom: 1px solid #333; color: var(--primary); position: sticky; top: 0; background: var(--sidebar); z-index: 10; }
        
        .channel { 
            display: flex; align-items: center; padding: 15px; cursor: pointer; 
            transition: 0.2s; border-bottom: 1px solid #222; outline: none;
        }
        .channel:hover, .channel.focused { background: var(--focus); border-left: 4px solid var(--primary); }
        .channel.active { background: var(--active); border-left: 4px solid var(--primary); }
        
        .channel img { width: 60px; height: 35px; object-fit: contain; border-radius: 4px; margin-right: 12px; background: #fff; }
        .channel h4 { margin: 0; font-size: 14px; }
        .channel-group { font-size: 10px; color: #aaa; text-transform: uppercase; display: block; }

        /* Main Player Area */
        .main { flex: 1; display: flex; flex-direction: column; }
        .player-wrapper { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        
        /* VideoJS Custom Style */
        .video-js { width: 100% !important; height: 100% !important; }
        
        .info-bar { padding: 10px 20px; background: #111; border-bottom: 1px solid #333; }
        #titleStatus { margin: 0; font-size: 16px; color: #ccc; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; order: 2; }
            .main { flex: 1; order: 1; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="playlist">
        <div class="header">TV INDONESIA</div>
        </div>

    <div class="main">
        <div class="info-bar">
            <div id="titleStatus">Pilih Channel...</div>
        </div>

        <div class="player-wrapper">
            <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                <p class="vjs-no-js">Aktifkan JavaScript untuk menonton.</p>
            </video>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const channels = [
            { name: "RCTI", url: "http://203.77.246.58:4500/udp/239.1.3.80:5000", group: "General", logo: "https://i.imgur.com/iLFx8ia.png" },
            { name: "SCTV", url: "http://203.77.246.58:4500/udp/239.1.1.108:5000", group: "General", logo: "https://i.imgur.com/EMmOvnQ.png" },
            { name: "Indosiar", url: "http://203.77.246.58:4500/udp/239.1.1.110:5000", group: "General", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Indosiar_2015.svg/512px-Indosiar_2015.svg.png" },
            { name: "Trans TV", url: "https://video.detik.com/transtv/smil:transtv.smil/index.m3u8", group: "General", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/6/62/Trans_TV_2013.svg/512px-Trans_TV_2013.svg.png" },
            { name: "Trans7", url: "https://video.detik.com/trans7/smil:trans7.smil/index.m3u8", group: "General", logo: "https://i.imgur.com/fAbGImS.png" },
            { name: "CNBC Indonesia", url: "https://live.cnbcindonesia.com/livecnbc/smil:cnbctv.smil/master.m3u8", group: "Business", logo: "https://i.imgur.com/bUfeG7Y.png" },
            { name: "BTV", url: "https://btv.secureswiftcontent.com/han/btv/btv10005/srtoutput/manifest.m3u8", group: "News", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/BTV_%28Indonesia%29_logo_%282025%29.svg/2560px-BTV_%28Indonesia%29_logo_%282025%29.svg.png" },
            { name: "Rodja TV", url: "https://rodjatv.com/rodjatv/live.m3u8", group: "Religious", logo: "https://i.imgur.com/XwCeHlC.png" },
            { name: "Al-Iman TV", url: "https://tv.aliman.id/aliman/live.m3u8", group: "Religious", logo: "https://i.imgur.com/Qj1EFf1.png" },
            { name: "TVRI Aceh", url: "https://ott-balancer.tvri.go.id/live/eds/Aceh/hls/Aceh.m3u8", group: "General", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/TVRILogo2019.svg/512px-TVRILogo2019.svg.png" }
        ];

        const player = videojs('my-video');
        const playlistEl = document.getElementById('playlist');
        const titleEl = document.getElementById('titleStatus');
        let currentIndex = -1;

        // Render Sidebar Channel
        channels.forEach((ch, index) => {
            const item = document.createElement('div');
            item.className = 'channel';
            item.tabIndex = 0; // Agar bisa difokuskan keyboard
            item.innerHTML = `
                <img src="${ch.logo}" alt="logo">
                <div>
                    <span class="channel-group">${ch.group}</span>
                    <h4>${ch.name}</h4>
                </div>
            `;
            item.onclick = () => playChannel(index);
            playlistEl.appendChild(item);
        });

        const channelElements = document.querySelectorAll('.channel');

        function playChannel(index) {
            currentIndex = index;
            const ch = channels[index];
            
            // UI Update
            channelElements.forEach(el => el.classList.remove('active'));
            channelElements[index].classList.add('active');
            titleEl.innerText = "Sedang Menonton: " + ch.name;

            // Video Source Update
            player.src({
                src: ch.url,
                type: 'application/x-mpegURL'
            });
            player.play();
        }

        // Navigasi Remote (Panah Atas, Bawah, Enter)
        document.addEventListener('keydown', function(e) {
            if (e.key === "ArrowDown") {
                currentIndex = (currentIndex + 1) % channelElements.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentIndex = (currentIndex - 1 + channelElements.length) % channelElements.length;
                updateFocus();
                e.preventDefault();
            } else if (e.key === "Enter") {
                if (currentIndex !== -1) {
                    playChannel(currentIndex);
                }
            }
        });

        function updateFocus() {
            channelElements.forEach((el, index) => {
                if (index === currentIndex) {
                    el.classList.add('focused');
                    el.focus();
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('focused');
                }
            });
        }
    </script>
</body>
</html>
