<script>
document.addEventListener('keydown', (e) => {
    const current = document.activeElement;

    // Shortcut angka
    if (e.key >= '1' && e.key <= '9') {
        const ch = document.querySelector(`[data-channel-num="${e.key}"]`);
        if (ch) {
            ch.focus();
            ch.click();
        }
        return;
    }

    // ENTER / OK
    if (e.key === 'Enter') {
        current?.click();
        return;
    }

    // BACK
    if (e.key === 'Backspace') {
        window.history.back();
        return;
    }

    // Navigasi grid channel
    if (current?.classList.contains('channel-card')) {
        const cards = [...document.querySelectorAll('.channel-card')];
        const index = cards.indexOf(current);
        const cols = 2;

        let next = index;
        if (e.key === 'ArrowRight') next++;
        if (e.key === 'ArrowLeft') next--;
        if (e.key === 'ArrowDown') next += cols;
        if (e.key === 'ArrowUp') next -= cols;

        if (cards[next]) {
            cards[next].focus();
            cards[next].scrollIntoView({ block: 'center' });
            e.preventDefault();
        }
    }
});
</script>
