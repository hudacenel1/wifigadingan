<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFIGadingan Smart TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f0f2f5;
            --text-dark: #212529;
            --focus-border: #ffc107;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .container-fluid {
            max-width: 1600px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        /* --- VIDEO PLAYER --- */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #dee2e6;
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        #videoOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; color: white;
        }

        /* --- CHANNEL GRID (3 KOLOM) --- */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Kolom */
            gap: 10px;
            max-height: 75vh;
            overflow-y: auto;
            padding: 5px;
        }

        /* --- CHANNEL CARD KECIL --- */
        .channel-card {
            background: #f8f9fa;
            padding: 10px 5px;
            text-align: center;
            border-radius: 12px;
            border: 3px solid #e9ecef;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .channel-logo {
            width: 50px; /* Ukuran icon kecil */
            height: 35px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .channel-name { 
            font-weight: bold; 
            font-size: 0.75rem; /* Font kecil agar pas 3 kolom */
            color: #333; 
            white-space: nowrap;
            overflow: hidden;
        }

        /* FOCUS STATE */
        .channel-card:focus, #videoOverlay:focus {
            outline: none;
            border-color: var(--focus-border) !important;
            background-color: var(--primary-color) !important;
            transform: scale(1.08);
            z-index: 10;
        }
        .channel-card:focus .channel-name { color: white; }

        .active-watching {
            background-color: #d1e7dd !important;
            border-color: #198754 !important;
        }

        #channelNotify {
            position: absolute; top: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.9);
            color: var(--focus-border);
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 3rem; font-weight: bold;
            display: none; z-index: 1000;
            border: 3px solid var(--focus-border);
        }

        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
    
<body>
   

<div id="channelNotify">01</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-7">
            <div class="video-wrapper">
                <div id="videoOverlay" tabindex="1" onclick="startExperience()">
                    <h1>TV GADINGAN</h1>
                    <p>Tekan OK untuk Mulai</p>
                </div>
                <iframe id="mainPlayer" src="" allow="autoplay; fullscreen"></iframe>
            </div>
            <h3 id="channelTitle" class="mt-3 text-primary fw-bold">Pilih Saluran...</h3>
        </div>

        <div class="col-lg-5">
            <h5 class="mb-3 fw-bold">DAFTAR SALURAN</h5>
            <div class="channel-grid" id="gridContent">
                
                src="https://www.youtube.com/embed/PYXT0mwHq4s" 
                <div class="channel-card" tabindex="2" data-channel-num="1" onclick="https://youtu.be/PYXT0mwHq4s">
                    <img src="rcti.jpg" class="channel-logo">
                    <div class="channel-name">1. RCTI</div>
                </div>

                <div class="channel-card" tabindex="3" data-channel-num="2" onclick="changeChannel('GTV', 'URL_DISINI')">
                    <img src="gtv.jpg" class="channel-logo">
                    <div class="channel-name">2. GTV</div>
                </div>

                <div class="channel-card" tabindex="4" data-channel-num="3" onclick="changeChannel('MNCTV', 'URL_DISINI')">
                    <img src="mnctv.jpg" class="channel-logo">
                    <div class="channel-name">3. MNCTV</div>
                </div>

                <div class="channel-card" tabindex="5" data-channel-num="4" onclick="changeChannel('iNews', 'URL_DISINI')">
                    <img src="inewtv.jpg" class="channel-logo">
                    <div class="channel-name">4. iNews</div>
                </div>

                <div class="channel-card" tabindex="6" data-channel-num="5" onclick="changeChannel('TRANS7', 'URL_DISINI')">
                    <img src="trans7.jpg" class="channel-logo">
                    <div class="channel-name">5. TRANS7</div>
                </div>

                <div class="channel-card" tabindex="7" data-channel-num="6" onclick="changeChannel('TRANS TV', 'URL_DISINI')">
                    <img src="transtv.jpg" class="channel-logo">
                    <div class="channel-name">6. TRANSTV</div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    let notifyTimeout;

    function showNotification(num) {
        const notifyEl = document.getElementById('channelNotify');
        notifyEl.innerText = num.toString().padStart(2, '0');
        notifyEl.style.display = 'block';
        clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => { notifyEl.style.display = 'none'; }, 2000);
    }

    document.addEventListener('keydown', function(e) {
        const focusables = Array.from(document.querySelectorAll('#videoOverlay, .channel-card'));
        let index = focusables.indexOf(document.activeElement);
        const cols = 3; // Berubah jadi 3 kolom

        let nextIndex;
        switch (e.key) {
            case 'ArrowRight': nextIndex = index + 1; break;
            case 'ArrowLeft':  nextIndex = index - 1; break;
            case 'ArrowDown':  nextIndex = (index === 0) ? 1 : index + cols; break;
            case 'ArrowUp':    nextIndex = (index <= cols) ? 0 : index - cols; break;
            case 'Enter': if (document.activeElement) document.activeElement.click(); return;
            default: return;
        }

        if (nextIndex >= 0 && nextIndex < focusables.length) {
            focusables[nextIndex].focus();
            e.preventDefault();
        }
    });

    function changeChannel(name, url) {
        document.getElementById('videoOverlay').style.display = 'none';
        const player = document.getElementById('mainPlayer');
        player.src = url + (url.includes('?') ? '&' : '?') + "autoplay=1";
        document.getElementById('channelTitle').innerText = "Menonton: " + name;

        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-watching'));
        const current = Array.from(document.querySelectorAll('.channel-card')).find(c => c.innerText.includes(name));
        if (current) {
            current.classList.add('active-watching');
            showNotification(current.getAttribute('data-channel-num'));
        }
    }

    function startExperience() {
        document.getElementById('videoOverlay').style.display = 'none';
        const first = document.querySelector('.channel-card');
        if (first) { first.focus(); first.click(); }
    }

    window.onload = () => document.getElementById('videoOverlay').focus();
</script>
   

</body>
</html>
