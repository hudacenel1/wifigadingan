<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIFIGadingan Smart TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f0f2f5;
            --text-dark: #212529;
            --focus-border: #ffc107; /* Kuning Emas agar kontras di TV */
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .container-fluid {
            max-width: 1600px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        /* --- VIDEO PLAYER --- */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #dee2e6;
        }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        #videoOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85) url('https://www.transparenttextures.com/patterns/black-linen.png');
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; cursor: pointer; color: white;
        }

        /* --- OSD NOTIFICATION --- */
        #channelNotify {
            position: absolute; top: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.9);
            color: var(--focus-border);
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 4rem; font-weight: bold;
            display: none; z-index: 1000;
            border: 4px solid var(--focus-border);
        }

        /* --- CHANNEL GRID --- */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 Kolom untuk Remote TV */
            gap: 15px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
            scroll-behavior: smooth;
        }

        /* --- CHANNEL CARD --- */
        .channel-card {
            background: #fff;
            padding: 20px 10px;
            text-align: center;
            border-radius: 15px;
            border: 4px solid #e9ecef;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .channel-logo {
            width: 100px; height: 60px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .channel-name { font-weight: bold; font-size: 1.1rem; color: #333; }

        /* --- FOCUS STATE (PENTING UNTUK REMOTE) --- */
        .channel-card:focus, .btn-back:focus, #videoOverlay:focus {
            outline: none;
            border-color: var(--focus-border) !important;
            background-color: var(--primary-color) !important;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 193, 7, 0.6);
        }

        .channel-card:focus .channel-name { color: white; }

        .active-watching {
            background-color: #d1e7dd !important;
            border-color: #198754 !important;
        }

        /* Sembunyikan Scrollbar */
        ::-webkit-scrollbar { width: 0; }
        
        .btn-back {
            display: inline-block;
            padding: 12px 25px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 4px solid transparent;
        }
    </style>
</head>
<body>

<div id="channelNotify">01</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-lg-7">
            <a href="index.html" class="btn-back">← KEMBALI</a>
            
            <div class="video-wrapper">
                <div id="videoOverlay" tabindex="1" onclick="startExperience()">
                    <h1 style="font-size: 3rem;">TV GADINGAN</h1>
                    <p>Tekan OK/Enter untuk Menonton</p>
                </div>
                <iframe id="mainPlayer"  src="logo/gpt.png" allow="autoplay; fullscreen"></iframe>
            </div>
            <h2 id="channelTitle" class="mt-4 text-primary fw-bold">Pilih Saluran...</h2>
        </div>

        <div class="col-lg-5">
            <h4 class="mb-3 fw-bold">DAFTAR SALURAN (Gunakan Panah Remote)</h4>
            <div class="channel-grid" id="gridContent">
                
                <div class="channel-card" tabindex="2" data-channel-num="1" onclick="changeChannel('RCTI', ':sout=#transcode{vcodec=h264,vb=56,venc=x264{profile=baseline},fps=12,scale=Auto,width=176,height=144,acodec=mp3,ab=24,channels=1,samplerate=44100,scodec=none}:http{mux=ffmpeg{mux=flv},dst=:8080/} :no-sout-all :sout-keep">
                    <img src="rcti.jpg" class="rcti">
                    <div class="channel-name">1. RCTI</div>
                </div>

                <div class="channel-card" tabindex="3" data-channel-num="2" onclick="changeChannel('GTV', 'https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==')">
                    <img src="gtv.jpg" class="gtv">
                    <div class="channel-name">2. GTV</div>
                </div>

                <div class="channel-card" tabindex="4" data-channel-num="3" onclick="changeChannel('MNCTV', 'https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                    <img src="mnctv.jpg" class="mnc">
                    <div class="channel-name">3. MNCTV</div>
                </div>

                <div class="channel-card" tabindex="5" data-channel-num="4" onclick="changeChannel('iNews', 'https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1')">
                    <img src="inewtv.jpg" class="inewtv">
                    <div class="channel-name">4. iNews TV</div>
                </div>

                <div class="channel-card" tabindex="6" data-channel-num="5" onclick="changeChannel('TRANS7', 'https://20.detik.com/watch/livestreaming-trans7')">
                    <img src="trans7.jpg" class="trans7">
                    <div class="channel-name">5. TRANS 7</div>
                </div>

                <div class="channel-card" tabindex="7" data-channel-num="6" onclick="changeChannel('TRANS TV', 'https://20.detik.com/watch/livestreaming-transtv')">
                    <img src="transtv.jpg" class="trantv">
                    <div class="channel-name">6. TRANS TV</div>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    let notifyTimeout;

    // Fungsi Notifikasi Nomor Saluran
    function showNotification(num) {
        const notifyEl = document.getElementById('channelNotify');
        notifyEl.innerText = num.toString().padStart(2, '0');
        notifyEl.style.display = 'block';
        notifyEl.style.opacity = '1';
        clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => {
            notifyEl.style.opacity = '0';
            setTimeout(() => { notifyEl.style.display = 'none'; }, 500);
        }, 2000);
    }

    // Navigasi Remote
    document.addEventListener('keydown', function(e) {
        const focusables = Array.from(document.querySelectorAll('.btn-back, #videoOverlay, .channel-card'));
        let index = focusables.indexOf(document.activeElement);

        // Shortcut Tombol Angka (1-9)
        if (e.key >= '1' && e.key <= '9') {
            const target = document.querySelector(`[data-channel-num="${e.key}"]`);
            if (target) {
                target.focus();
                target.click();
            }
            return;
        }

        let nextIndex;
        const cols = 2; // Karena grid kita pakai 2 kolom

        switch (e.key) {
            case 'ArrowRight': nextIndex = index + 1; break;
            case 'ArrowLeft':  nextIndex = index - 1; break;
            case 'ArrowDown':  nextIndex = index + cols; break;
            case 'ArrowUp':    nextIndex = index - cols; break;
            case 'Enter':
                if (document.activeElement) document.activeElement.click();
                return;
            case 'Backspace': 
                window.history.back(); 
                return;
            default: return;
        }

        if (nextIndex >= 0 && nextIndex < focusables.length) {
            focusables[nextIndex].focus();
            e.preventDefault();
        }

        // Scroll otomatis daftar channel
        const active = document.activeElement;
        if (active.classList.contains('channel-card')) {
            active.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });

    function changeChannel(name, url) {
        document.getElementById('videoOverlay').style.display = 'none';
        const player = document.getElementById('mainPlayer');
        const separator = url.includes('?') ? '&' : '?';
        
        player.src = url + separator + "autoplay=1";
        document.getElementById('channelTitle').innerText = "Menonton: " + name;

        // Update UI Active
        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-watching'));
        const current = Array.from(document.querySelectorAll('.channel-card')).find(c => c.innerText.includes(name));
        if (current) {
            current.classList.add('active-watching');
            showNotification(current.getAttribute('data-channel-num'));
        }
    }

    function startExperience() {
        document.getElementById('videoOverlay').style.display = 'none';
        const first = document.querySelector('.channel-card');
        if (first) {
            first.focus();
            first.click();
        }
    }

    window.onload = () => {
        document.getElementById('videoOverlay').focus();
    };
</script>

</body>
</html>
