<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Stream - Web TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --bg: #0f0f0f; 
            --side: #1a1a1a; 
            --text: #ffffff; 
            --accent: #ff0000; 
            --hover: #333333;
            --active-bg: #2a2a2a;
        }
        
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { width: 350px; background: var(--side); display: flex; flex-direction: column; border-right: 1px solid #333; }
        
        .sidebar-header { padding: 20px; background: #111; border-bottom: 1px solid #333; }
        .brand-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* Menu Button Style */
        .btn-menu { 
            text-decoration: none; 
            color: #ccc; 
            font-size: 0.8em; 
            padding: 5px 12px; 
            border: 1px solid #444; 
            border-radius: 4px; 
            transition: 0.3s;
        }
        .btn-menu:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .search-box { padding: 10px 20px; }
        input { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; 
            background: #000; color: white; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--accent); }

        #channel-list { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        
        /* Channel Item */
        .channel-item { 
            padding: 12px 20px; border-bottom: 1px solid #222; 
            cursor: pointer; display: flex; align-items: center; transition: 0.2s; 
        }
        .channel-item:hover { background: var(--hover); }
        .channel-item.active { background: var(--active-bg); border-left: 4px solid var(--accent); }
        
        .channel-item img { width: 50px; height: 35px; object-fit: contain; margin-right: 15px; background: #000; border-radius: 4px; border: 1px solid #333; }
        .channel-info { overflow: hidden; }
        .channel-name { font-size: 0.95em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-group { font-size: 0.75em; color: #888; text-transform: uppercase; margin-top: 4px; }

        /* Main Player Area */
        #main { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        .video-container { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
        
        .player-info-bar { padding: 15px 25px; background: #111; border-bottom: 1px solid #222; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 40vh; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="brand-area">
            <h2 style="margin:0; color: var(--accent); letter-spacing: 1px;">GADINGAN TV</h2>
            <a href="index.html" class="btn-menu">KEMBALI KE MENU</a>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Cari nama saluran..." onkeyup="filterChannels()">
        </div>
    </div>
    <div id="channel-list"></div>
</div>

<div id="main">
    <div class="player-info-bar">
        <div id="now-playing" style="font-size: 1.1em; color: #aaa;">Selamat Datang. Silakan pilih saluran.</div>
    </div>
    <div class="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>
</div>

<script>
    const channels = [
        { name: "1-2-3 TV (270p)", group: "Shop", logo: "https://i.imgur.com/slSUDNX.png", url: "https://youtu.be/AVfJeZxcbF0" },
        { name: "1Almere TV (720p)", group: "General", logo: "https://i.imgur.com/XfkbTrU.png", url: "https://d3472rjicrodic.cloudfront.net/nlpo/clr-nlpo/709d5260/index.m3u8" },
        { name: "1KZN TV (576p)", group: "Entertainment", logo: "https://i.postimg.cc/cCPc5tyk/1kzntv.png", url: "https://cdn.freevisiontv.co.za/sttv/smil:1kzn.stream.smil/playlist.m3u8" },
        { name: "1Music Channel Hungary", group: "Music", logo: "https://i.imgur.com/pzU6FrQ.png", url: "http://1music.hu/1music.m3u8" },
        { name: "1TV (720p)", group: "General", logo: "https://i.imgur.com/FSkYLPK.png", url: "https://tv.cdn.xsg.ge/gpb-1tv/index.m3u8" },
        { name: "2GB Sydney (1080p)", group: "News", logo: "https://i.ibb.co/jwM8DFG/2GB-1.png", url: "https://2gblive.akamaized.net/hls/live/2033805/2GB/index.m3u8" },
        { name: "2M Monde", group: "General", logo: "https://i.imgur.com/MvpntzA.png", url: "https://cdn-globecast.akamaized.net/live/eds/2m_monde/hls_video_ts_tuhawxpiemz257adfc/2m_monde.m3u8" },
        { name: "3ABN Kids Network", group: "Kids", logo: "https://i.imgur.com/z3npqO1.png", url: "https://3abn.bozztv.com/3abn2/Kids_live/smil:Kids_live.smil/playlist.m3u8" },
        { name: "3CatInfo (1080p)", group: "News", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/3CatInfo_logo.svg/512px-3CatInfo_logo.svg.png", url: "https://directes-tv-int.3catdirectes.cat/live-origin/canal324-hls/master.m3u8" },
        { name: "4 Kurd", group: "Music", logo: "https://www.aparatchi.com/images/chanells-logo/4kurd.svg", url: "https://4kuhls.persiana.live/hls/stream.m3u8" },
        { name: "9X Jalwa (1080p)", group: "Music", logo: "https://i.imgur.com/qubgOi5.png", url: "https://d35j504z0x2vu2.cloudfront.net/v1/master/0bc8e8376bd8417a1b6761138aa41c26c7309312/9x-jalwa/master.m3u8" },
        { name: "24 Horas (1080p)", group: "News", logo: "https://i.imgur.com/IUVRm5L.png", url: "https://d32rw80ytx9uxs.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-vlldndmow4yre/24HES.m3u8" },
        { name: "360° (1080p)", group: "General", logo: "https://i.imgur.com/VTJqdoX.png", url: "https://cdn-evacoder-tv.facecast.io/evacoder_hls_hi/CkxfR1xNUAJwTgtXTBZTAJli/index.m3u8" }
        // ... Anda bisa menambahkan kembali semua channel lainnya di sini
    ];

    const video = document.getElementById('video');
    const channelContainer = document.getElementById('channel-list');
    const nowPlaying = document.getElementById('now-playing');
    let hls = new Hls();

    function renderChannels(filter = "") {
        channelContainer.innerHTML = "";
        channels.forEach((ch, index) => {
            if (ch.name.toLowerCase().includes(filter.toLowerCase())) {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <img src="${ch.logo || 'https://via.placeholder.com/50x35?text=TV'}" onerror="this.src='https://via.placeholder.com/50x35?text=TV'">
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-group">${ch.group}</div>
                    </div>
                `;
                div.onclick = () => {
                    playChannel(ch.url, ch.name);
                    // Update Active UI
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                channelContainer.appendChild(div);
            }
        });
    }

    function playChannel(url, name) {
        nowPlaying.innerHTML = `<span style="color:var(--accent)">● SEDANG DIPUTAR:</span> ${name}`;
        
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    nowPlaying.innerHTML = `<span style="color:orange">⚠️ Gagal memuat saluran: ${name}</span>`;
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    function filterChannels() {
        const val = document.getElementById('search').value;
        renderChannels(val);
    }

    // Inisialisasi awal
    renderChannels();
</script>

</body>
</html>
