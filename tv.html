    <style>
        :root { --bg: #0f0f0f; --side: #1a1a1a; --text: #ffffff; --accent: #ff0000; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { width: 350px; background: var(--side); display: flex; flex-direction: column; border-right: 1px solid #333; }
        .search-box { padding: 15px; background: #111; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #333; color: white; box-sizing: border-box; }
        #channel-list { flex-grow: 1; overflow-y: auto; }
        
        /* Channel Item */
        .channel-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; transition: 0.2s; }
        .channel-item:hover { background: #333; }
        .channel-item img { width: 45px; height: 30px; object-fit: contain; margin-right: 15px; background: #000; border-radius: 3px; }
        .channel-info { overflow: hidden; }
        .channel-name { font-size: 0.9em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-group { font-size: 0.7em; color: #888; text-transform: uppercase; margin-top: 3px; }

        /* Main Player Area */
        #main { flex-grow: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; max-height: 80vh; background: #000; outline: none; }
        .player-header { padding: 15px 25px; background: rgba(0,0,0,0.8); z-index: 10; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>

    ];

    const video = document.getElementById('video');
    const channelContainer = document.getElementById('channel-list');
    const nowPlaying = document.getElementById('now-playing');
    let hls = new Hls();

    function renderChannels(filter = "") {
        channelContainer.innerHTML = "";
        channels.forEach(ch => {
            if (ch.name.toLowerCase().includes(filter.toLowerCase())) {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <img src="${ch.logo || 'https://via.placeholder.com/45x30?text=TV'}" onerror="this.src='https://via.placeholder.com/45x30?text=TV'">
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-group">${ch.group}</div>
                    </div>
                `;
                div.onclick = () => playChannel(ch.url, ch.name);
                channelContainer.appendChild(div);
            }
        });
    }

    function playChannel(url, name) {
        nowPlaying.innerText = "SEDANG DIPUTAR: " + name;
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) console.error("Error loading stream");
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
        }
    }

    function filterChannels() {
        const val = document.getElementById('search').value;
        renderChannels(val);
    }

    // Inisialisasi
    renderChannels();
</script>
